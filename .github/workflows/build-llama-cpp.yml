# Build Llama.cpp image - works on main repo (scheduled + manual) and forks (manual)
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#   DOCKERHUB_NAMESPACE          - production namespace (final multi-arch index lives here)
#   DOCKERHUB_NAMESPACE_STAGING  - staging namespace (per-arch build artifacts live here)
# Optional: SLACK_WEBHOOK_URL
#
# Release detection: Polls GitHub (ai-dock/llama.cpp-cuda) for new release tags.
#
# Multi-arch strategy: each (base_image, arch) pair builds natively on the
# matching runner (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) and
# pushes an arch-suffixed tag to the STAGING namespace. A per-base_image
# merge job then uses crane to assemble the multi-arch index at the
# PRODUCTION tag. No QEMU emulation.
#
# Upstream `ai-dock/llama.cpp-cuda` now publishes both amd64 and arm64
# tarballs per release (since release b9264+). The Dockerfile picks the
# right one via `dpkg --print-architecture`, so the same Dockerfile build
# path runs identically on both runner arches.

name: Build Llama.cpp Image

on:
  schedule:
    # Run weekly on Monday
    - cron: '0 0 * * 1'

  workflow_dispatch:
    inputs:
      LLAMA_CPP_VERSION:
        description: "Release tag (e.g. b5460) - leave empty for latest"
        required: false
      CUDA_VERSION:
        description: "Override the llama.cpp binary package's CUDA version (single-line builds only)"
        required: false
      DOCKERHUB_REPO:
        description: "Push to namespace/<repo>"
        required: true
        default: "llama-cpp"
      CUSTOM_IMAGE_TAG:
        description: "Custom tag (Auto default)"
        required: false

env:
  DEFAULT_DOCKERHUB_REPO: "llama-cpp"
  # 7 days
  RELEASE_AGE_THRESHOLD: 604800

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decision.outputs.should-run }}
      llama-cpp-version: ${{ steps.release-check.outputs.resolved-ref }}
      build-matrix: ${{ steps.expand.outputs.build-matrix }}
      merge-matrix: ${{ steps.expand.outputs.merge-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required secrets
        id: secrets
        run: |
          missing=()
          [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]] && missing+=("DOCKERHUB_USERNAME")
          [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]] && missing+=("DOCKERHUB_TOKEN")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE }}" ]] && missing+=("DOCKERHUB_NAMESPACE")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}" ]] && missing+=("DOCKERHUB_NAMESPACE_STAGING")
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Required secrets configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping - missing secrets: ${missing[*]}"
          fi

      - name: Check GitHub for new release
        id: release-check
        uses: ./.github/actions/check-github-release
        with:
          repository: ai-dock/llama.cpp-cuda
          age-threshold-seconds: ${{ env.RELEASE_AGE_THRESHOLD }}
          trigger: ${{ github.event_name }}
          manual-ref: ${{ inputs.LLAMA_CPP_VERSION }}
          resolve-master-to-commit: "false"

      - name: Determine if build should run
        id: decision
        run: |
          SECRETS="${{ steps.secrets.outputs.available }}"
          NEW_RELEASE="${{ steps.release-check.outputs.new-release }}"
          VERSION="${{ steps.release-check.outputs.resolved-ref }}"

          if [[ "$SECRETS" == "true" && "$NEW_RELEASE" == "true" && -n "$VERSION" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Building Llama.cpp $VERSION"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT

            if [[ "$SECRETS" != "true" ]]; then
              echo "::notice::Skipping - Required secrets not configured"
            elif [[ "$NEW_RELEASE" != "true" ]]; then
              echo "::notice::Skipping - No new release detected"
            else
              echo "::notice::Skipping - No version resolved"
            fi
          fi

      # ONE declaration per promoted CUDA line, expanded into the two matrix shapes
      # every downstream job keys on. Previously the base image was hardcoded in THREE
      # places (build, merge-manifests) and the QA tag in two more as the literal
      # `format('{0}-cuda-12.9', ...)`, so a second line would have built and PROMOTED
      # without ever being QA'd — the gate would have tested the 12.9 artifact and
      # reported "live-GPU QA passed" over both. Declaring lines once is what makes
      # adding one a data change instead of a rewiring.
      #
      # Fields, and why each is per-line rather than global:
      #   cuda          the promoted tag's CUDA suffix, and the QA cell's tag
      #   base          the base image this line builds FROM
      #   bundle_cuda   the CUDA version of the llama.cpp BINARY package, which is not
      #                 the base's: ai-dock publishes 12.8 tarballs that we run on a
      #                 12.9 base, relying on 12.x ABI compatibility
      #   driver_floor  the QA host's cuda_max_good floor. Renting a driver older than
      #                 the line under test validates nothing, and on a consumer GPU
      #                 (no forward-compat libs) it produces a CUDA backend that cannot
      #                 load — which llama.cpp serves from CPU silently (L076)
      #   arches        NOT a global cross-product. A line has the arches its binary
      #                 package actually ships; there is no reason to assume they match
      #                 across lines, and building a cell whose asset does not exist
      #                 fails late, in a download step, rather than here
      - name: Expand build/merge matrices
        id: expand
        if: steps.decision.outputs.should-run == 'true'
        run: |
          cat << 'LINES_EOF' > /tmp/lines.json
          [
            {
              "cuda": "12.9",
              "base": "vastai/base-image:cuda-12.9-mini-py312-2026-08-21",
              "bundle_cuda": "12.8",
              "driver_floor": "12.9",
              "arches": ["amd64", "arm64"]
            }
          ]
          LINES_EOF

          MERGE=$(jq -c 'map({cuda, base, bundle_cuda, driver_floor})' /tmp/lines.json)
          BUILD=$(jq -c '[ .[] as $l | $l.arches[] | {
              cuda: $l.cuda,
              base: $l.base,
              bundle_cuda: $l.bundle_cuda,
              arch: .,
              platform: ("linux/" + .),
              runs_on: (if . == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
            } ]' /tmp/lines.json)

          # A custom tag names ONE image. With two lines it would resolve to the same
          # string for both, so the second build would overwrite the first in staging
          # and QA would test whichever landed last while both promoted. Fail here,
          # where the message can say why, rather than in a registry race.
          LINE_COUNT=$(jq 'length' /tmp/lines.json)
          if [[ -n "${{ inputs.CUSTOM_IMAGE_TAG }}" && "$LINE_COUNT" -gt 1 ]]; then
            echo "::error::CUSTOM_IMAGE_TAG is set but ${LINE_COUNT} CUDA lines are declared — the tag would collide across lines"
            exit 1
          fi
          # Same shape, worse consequence: CUDA_VERSION selects the BINARY package, so a
          # global override would install one line's bundle on every line's base. Putting
          # a CUDA 12 bundle on a CUDA 13 base leaves libggml-cuda.so unable to resolve
          # libcublas.so.12 — and ggml_backend_dl turns that into a silent CPU fallback,
          # not a build failure, so nothing downstream would report it (L076 catches it
          # at QA, which is late and only on the cells that run).
          if [[ -n "${{ inputs.CUDA_VERSION }}" && "$LINE_COUNT" -gt 1 ]]; then
            echo "::error::CUDA_VERSION is set but ${LINE_COUNT} CUDA lines are declared — it would force one bundle onto every line"
            exit 1
          fi

          echo "Build matrix: $BUILD"
          echo "Merge matrix: $MERGE"
          echo "build-matrix=$BUILD" >> $GITHUB_OUTPUT
          echo "merge-matrix=$MERGE" >> $GITHUB_OUTPUT

  build:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ${{ matrix.runs_on }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.build-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Derive staging tag
        run: |
          # The CUDA suffix now comes from the matrix rather than being re-parsed out
          # of the base image tag in each job. Same string, one source: three jobs
          # parsing the same tag independently is how they drift apart.
          CUDA_VERSION="${{ matrix.cuda }}"
          LLAMA_CPP_VERSION="${{ needs.preflight.outputs.llama-cpp-version }}"
          CUDA_BIN_VERSION="${{ inputs.CUDA_VERSION || matrix.bundle_cuda }}"

          IMAGE_TAG="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="${LLAMA_CPP_VERSION}-cuda-${CUDA_VERSION}"
          fi

          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "CUDA_BIN_VERSION=$CUDA_BIN_VERSION" >> $GITHUB_ENV
          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV

          echo "Derived staging tag base: $STAGING_TAG_BASE (arch=${{ matrix.arch }})"

      - name: Build and push arch image to staging
        uses: ./.github/actions/build-arch-image
        with:
          context: derivatives/llama-cpp
          arch: ${{ matrix.platform }}
          tag-base: ${{ env.STAGING_TAG_BASE }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            LLAMA_CPP_VERSION=${{ needs.preflight.outputs.llama-cpp-version }}
            CUDA_VERSION=${{ env.CUDA_BIN_VERSION }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Live-GPU QA gate (ADR 0005). This image had NO gate: merge-manifests depended only
  # on build, so an image that COMPILED was promoted whether or not it served.
  #
  # ONE CELL PER PROMOTED LINE. This was a single cell with the tag hardcoded as
  # `format('{0}-cuda-12.9', ...)`, carrying a comment that said one cell was correct
  # "because there is currently exactly one base image" — true when written, and a
  # trap: the next line added to the build matrix would have been promoted on the
  # strength of a QA run against a DIFFERENT artifact, with Slack reporting
  # "live-GPU QA passed" over both. The matrix now comes from the same declaration
  # the build job expands, so a line cannot exist without a cell that tests it.
  qa:
    needs: [preflight, build]
    if: needs.preflight.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'llama-cpp' }}
      tag: ${{ inputs.CUSTOM_IMAGE_TAG || format('{0}-cuda-{1}', needs.preflight.outputs.llama-cpp-version, matrix.cuda) }}-amd64
      template_dir: derivatives/llama-cpp/templates/llama-cpp-qa
      label: base-image-qa-llama-cpp
      log_paths: "/var/log/portal/llama.log"
      # The linted template floor describes the line it was written for; this raises it
      # to the line under test. create.py refuses an override that WIDENS selection, so
      # this can only ever narrow. Without it a CUDA 13 image would be validated on a
      # CUDA 12 driver: on a datacenter GPU forward compat hides it, on a consumer GPU
      # the backend cannot load — and llama.cpp serves that from CPU without an error,
      # so the cell would fail on one host class, redraw (ADR 0029), pass on another,
      # and promote.
      set_filters: "cuda_max_good.gte=${{ matrix.driver_floor }}"
      # Unique per cell — upload-artifact@v4 rejects duplicate names within a run, so a
      # second line without this would kill the evidence upload for both.
      evidence_name: qa-evidence-llama-cpp-cuda-${{ matrix.cuda }}
      require_tests: "base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries llama.d/10-llama-serving llama.d/11-llama-offload llama.d/12-llama-contract"
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Serverless cell (ADR 0031 decision 3). The ONLY product difference from the
  # standard cell is SERVERLESS=true — BACKEND, MODEL_NAME and MODEL_LOG are all
  # deliberately absent, because the image bakes BACKEND=llama and pyworker's core.py
  # resolves the benchmark model from LLAMA_MODEL and the log path from its own
  # EngineDefaults. Passing them would test our values instead of the image's.
  #
  # INSTANCE_TEST_REQUIRE_PASS is not a product difference: no customer template
  # carries it. It is how the gate asserts, and this mode has more tests that must
  # have passed because base/85 and the pyworker score stop being inert.
  #
  # IT DOES NOT GATE YET: merge-manifests lists it in `needs` so it is ORDERED ahead
  # of the approval prompt, and its `if` does not require the result.
  qa-serverless:
    needs: [preflight, build]
    if: needs.preflight.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'llama-cpp' }}
      tag: ${{ inputs.CUSTOM_IMAGE_TAG || format('{0}-cuda-{1}', needs.preflight.outputs.llama-cpp-version, matrix.cuda) }}-amd64
      template_dir: derivatives/llama-cpp/templates/llama-cpp-qa
      label: base-image-qa-llama-cpp-serverless
      set_filters: "cuda_max_good.gte=${{ matrix.driver_floor }}"
      evidence_name: qa-evidence-llama-cpp-serverless-cuda-${{ matrix.cuda }}
      log_paths: "/var/log/portal/llama.log /var/log/portal/pyworker.log /workspace/pyworker.log /workspace/debug.log"
      extra_env: |
        SERVERLESS=true
        INSTANCE_TEST_REQUIRE_PASS=base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries base/85-serverless-services llama.d/10-llama-serving llama.d/11-llama-offload llama.d/12-llama-contract llama.d/20-serverless-pyworker
      require_tests: "base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries base/85-serverless-services llama.d/10-llama-serving llama.d/11-llama-offload llama.d/12-llama-contract llama.d/20-serverless-pyworker"
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # start_server.sh aborts when BACKEND is set and HF_TOKEN is not.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  merge-manifests:
    # qa-serverless is in `needs` to ORDER it ahead of the approval prompt and absent
    # from the `if` so it cannot BLOCK. `!cancelled()` is what stops a failed
    # serverless cell skipping this job, and it also switches off the implicit
    # "skip if any needed job failed" — so the results that MUST still block are named.
    #
    # PROMOTION COUPLING IS ALL-OR-NOTHING, DECIDED, NOT A PLACEHOLDER.
    # `needs.qa.result` is the AGGREGATE over every cell, so one red line holds every
    # line — including the lines that passed. That is the intended behaviour and it is
    # not a stepping stone to per-line independence.
    #
    # The case for per-line was considered and rejected. It runs: unlike base's 12
    # configs — which share the ROOT/ overlay and differ only in the CUDA base, so a
    # defect on one is evidence about all (ADR 0019) — these lines carry DIFFERENT
    # binaries from different toolkits, so a CUDA 13 defect is not evidence about the
    # CUDA 12 artifact and arguably should not hold it. What that argument leaves out
    # is that the lines are not independent products: they are the same image offered
    # on two driver lines, they share the ROOT/ overlay, the QA template and the test
    # suite, and a red cell far more often means the OVERLAY or the gate is wrong than
    # that one binary is. Promoting the other line in that state ships a half-verified
    # pair under one version string.
    #
    # It also fails CLOSED, where per-line has to get the missing-evidence-artifact
    # case right or it fails OPEN — and note qa-gate.yml uploads no artifact at all on
    # an ungated scheduled run, which is the common path on this weekly workflow.
    # "Read the artifact, treat absent as pass" is exactly the shape of the last two
    # defects fixed on this repo.
    needs: [preflight, build, qa, qa-serverless]
    if: >-
      !cancelled()
      && needs.preflight.outputs.should-run == 'true'
      && needs.build.result == 'success'
      && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        run: |
          CUDA_VERSION="${{ matrix.cuda }}"
          LLAMA_CPP_VERSION="${{ needs.preflight.outputs.llama-cpp-version }}"
          IMAGE_TAG="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="${LLAMA_CPP_VERSION}-cuda-${CUDA_VERSION}"
          fi

          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"
          PROD_TAG="${{ secrets.DOCKERHUB_NAMESPACE }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV
          echo "PROD_TAG=$PROD_TAG" >> $GITHUB_ENV

          # Keyed on the LINE, not on an md5 of the base image: the artifact name is
          # the only thing distinguishing one line's promoted tag from another's in
          # collect-tags, and a hash makes a collision unreadable when it happens.
          echo "MATRIX_ID=cuda-${CUDA_VERSION}" >> $GITHUB_ENV

      - name: Assemble multi-arch index in production
        uses: ./.github/actions/merge-arch-manifests
        with:
          target-tag: ${{ env.PROD_TAG }}
          source-tag-base: ${{ env.STAGING_TAG_BASE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record merged manifest tag
        run: |
          mkdir -p built-tags
          echo "${{ env.PROD_TAG }}" > built-tags/tag-${{ env.MATRIX_ID }}.txt

      - name: Upload manifest tag
        uses: actions/upload-artifact@v4
        with:
          name: built-tag-${{ env.MATRIX_ID }}
          path: built-tags/
          retention-days: 1

  collect-tags:
    needs: [preflight, build, merge-manifests]
    if: always() && needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download all tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: built-tag-*
          path: all-tags/
          merge-multiple: true

      - name: Aggregate tags
        id: collect
        run: |
          if [ -d all-tags ] && [ "$(ls -A all-tags 2>/dev/null)" ]; then
            TAGS=$(cat all-tags/*.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found tags: $TAGS"
          else
            echo "::warning::No tags found - build may have failed"
            TAGS="[]"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  notify:
    needs: [preflight, build, qa, qa-serverless, merge-manifests, collect-tags]
    if: always() && needs.preflight.outputs.should-run == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      build-result: ${{ needs.merge-manifests.result }}
      # Distinct failure labels from AGGREGATED .result: build broke vs the image
      # built and does not serve vs promotion failed. The serverless clause sits
      # AFTER promotion and leads with "promoted", because that cell does not gate —
      # without it a red serverless cell marks the run failed while merge-manifests
      # promoted, and Slack would read "Successful" beside a failed run.
      headline: ${{ (needs.build.result != 'success' && 'llama.cpp build failed') || (needs.qa.result == 'failure' && 'llama.cpp QA FAILED on real GPU — not promoted') || (needs.merge-manifests.result == 'failure' && 'llama.cpp promotion (manifest merge) failed') || (needs.qa-serverless.result == 'failure' && 'llama.cpp promoted — but the ADVISORY serverless cell FAILED (not gating yet)') || (needs.qa.outputs.gated == 'true' && 'llama.cpp promoted — live-GPU QA passed') || '' }}
      image-name: "Llama.cpp"
      image-ref: ${{ needs.preflight.outputs.llama-cpp-version }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
