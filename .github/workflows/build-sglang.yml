# .github/workflows/build-sglang.yml
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#   DOCKERHUB_NAMESPACE          - production namespace (final multi-arch index lives here)
#   DOCKERHUB_NAMESPACE_STAGING  - staging namespace (per-arch build artifacts live here)
# Optional: SLACK_WEBHOOK_URL
#
# Multi-arch strategy: each (variant, arch) pair builds natively on the
# matching runner (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) and
# pushes an arch-suffixed tag to the STAGING namespace. A per-variant merge
# job then uses crane to assemble the multi-arch index at the PRODUCTION tag.
# No QEMU emulation.

name: Build SGLang Image

on:
  schedule:
    # Run every 12 hours
    - cron: '0 0,12 * * *'

  workflow_dispatch:
    inputs:
      SGLANG_VERSION:
        description: "SGLang version (e.g. v0.5.7, or 'nightly') - leave empty for latest"
        required: false
      DOCKERHUB_REPO:
        description: "Push to username/<repo>"
        required: true
        default: "sglang"
      CUSTOM_IMAGE_TAG:
        description: "Custom tag (Auto default)"
        required: false

env:
  DEFAULT_DOCKERHUB_REPO: "sglang"
  # 12 hours
  RELEASE_AGE_THRESHOLD: 43200

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decision.outputs.should-run }}
      sglang-version: ${{ steps.nightly-check.outputs.is-nightly == 'true' && steps.nightly-check.outputs.version || steps.release-check.outputs.resolved-version }}
      build-matrix: ${{ steps.expand.outputs.build-matrix }}
      merge-matrix: ${{ steps.expand.outputs.merge-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required secrets
        id: secrets
        run: |
          missing=()
          [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]] && missing+=("DOCKERHUB_USERNAME")
          [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]] && missing+=("DOCKERHUB_TOKEN")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE }}" ]] && missing+=("DOCKERHUB_NAMESPACE")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}" ]] && missing+=("DOCKERHUB_NAMESPACE_STAGING")
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Required secrets configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping - missing secrets: ${missing[*]}"
          fi

      - name: Handle nightly build
        id: nightly-check
        if: inputs.SGLANG_VERSION == 'nightly'
        run: |
          echo "is-nightly=true" >> $GITHUB_OUTPUT
          echo "version=nightly-$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo 'matrix=[{"tag":"dev","cuda":"12.9"}]' >> $GITHUB_OUTPUT
          echo "Nightly build requested - using upstream 'dev' tag"

      - name: Check release and resolve version
        id: release-check
        if: inputs.SGLANG_VERSION != 'nightly'
        uses: ./.github/actions/check-dockerhub-release
        with:
          repository: lmsysorg/sglang
          # Upstream tag scheme (v0.5.10+): bare semver = default CUDA (12.9),
          # -cu130 etc. for explicit CUDA variants, optional .postN suffix.
          version-pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+(\\.post[0-9]+)?$"
          age-threshold-seconds: ${{ env.RELEASE_AGE_THRESHOLD }}
          trigger: ${{ github.event_name }}
          manual-version: ${{ inputs.SGLANG_VERSION }}

      - name: Build matrix from variant tags
        id: build-matrix
        if: inputs.SGLANG_VERSION != 'nightly' && steps.release-check.outputs.new-release == 'true'
        run: |
          VERSION="${{ steps.release-check.outputs.resolved-version }}"

          echo "Building matrix for version: $VERSION"

          # Write to temp file first to avoid shell interpolation issues
          cat << 'VARIANTS_EOF' > /tmp/variants.json
          ${{ steps.release-check.outputs.variant-tags }}
          VARIANTS_EOF

          VARIANTS=$(cat /tmp/variants.json)
          echo "Available variants: $VARIANTS"

          # Convert variant tags to build matrix.
          # Upstream tag scheme (v0.5.11+): multi-arch manifests, no -amd64 suffix.
          # SGLang flipped the default CUDA from 12.9 to 13.0 in v0.5.11, so
          # the bare <ver> tag now IS the CUDA 13.0 image (and is published
          # alongside an explicit -cu130 alias). Prefer explicit -cuNNN
          # suffixes; treat the bare $VERSION tag as CUDA 13.0 only when no
          # -cu130 variant exists, so releases that ship both don't produce
          # a duplicate CUDA 13.0 build (and the bare doesn't get mistagged
          # as 12.9, clobbering the real -cu129 image at push time).
          # Exclude rocm/xeon/cann/runtime variants by exact-matching
          # ^<VERSION>(-cu[0-9]+)?$.
          MATRIX=$(echo "$VARIANTS" | jq -c --arg ver "$VERSION" '
            map(select(test("^" + $ver + "(-cu[0-9]+)?$")))
            | . as $variants
            | ($variants | any(endswith("-cu130"))) as $has_cu130
            | $variants
            | map(
                . as $tag
                | if $tag | endswith("-cu130") then
                    {tag: $tag, cuda: "13.0"}
                  elif $tag | endswith("-cu129") then
                    {tag: $tag, cuda: "12.9"}
                  elif $tag | endswith("-cu128") then
                    {tag: $tag, cuda: "12.8"}
                  elif $tag == $ver and ($has_cu130 | not) then
                    {tag: $tag, cuda: "13.0"}
                  else
                    empty
                  end
              )
          ')

          echo "Build matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

          MATRIX_SIZE=$(echo "$MATRIX" | jq 'length')
          if [[ "$MATRIX_SIZE" -eq 0 ]]; then
            echo "::error::No valid image variants found for $VERSION"
            exit 1
          fi

          echo "Will build $MATRIX_SIZE image(s)"

      - name: Determine if build should run
        id: decision
        run: |
          SECRETS="${{ steps.secrets.outputs.available }}"

          if [[ "${{ steps.nightly-check.outputs.is-nightly }}" == "true" ]]; then
            if [[ "$SECRETS" == "true" ]]; then
              echo "should-run=true" >> $GITHUB_OUTPUT
              echo "Building nightly"
            else
              echo "should-run=false" >> $GITHUB_OUTPUT
              echo "::notice::Skipping - Required secrets not configured"
            fi
            exit 0
          fi

          NEW_RELEASE="${{ steps.release-check.outputs.new-release }}"
          MATRIX='${{ steps.build-matrix.outputs.matrix }}'
          MATRIX_SIZE=$(echo "${MATRIX:-[]}" | jq 'length // 0')

          if [[ "$SECRETS" == "true" && "$NEW_RELEASE" == "true" && "$MATRIX_SIZE" -gt 0 ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Building $MATRIX_SIZE image(s) for ${{ steps.release-check.outputs.resolved-version }}"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT

            if [[ "$SECRETS" != "true" ]]; then
              echo "::notice::Skipping - Required secrets not configured"
            elif [[ "$NEW_RELEASE" != "true" ]]; then
              echo "::notice::Skipping - No new release detected"
            else
              echo "::notice::Skipping - No valid image variants found"
            fi
          fi

      - name: Expand matrix with arch axis
        id: expand
        if: steps.decision.outputs.should-run == 'true'
        # Route the GHA conditional through an env var rather than
        # interpolating it directly into a single-quoted bash assignment.
        # The previous form embedded GHA's `== 'true'` string literal
        # inside bash single quotes — it worked (GHA evaluates `${{ ... }}`
        # before bash sees the line, so the inner single quotes never
        # reach bash) but it's the same script-injection-prone pattern
        # GitHub's docs warn against, and it confuses static analyzers.
        # env: injection is the recommended pattern.
        env:
          MERGE_MATRIX_RAW: ${{ steps.nightly-check.outputs.is-nightly == 'true' && steps.nightly-check.outputs.matrix || steps.build-matrix.outputs.matrix }}
        run: |
          MERGE_MATRIX="$MERGE_MATRIX_RAW"

          # Cross-product the variants matrix with native-runner arch entries.
          # Each build job pulls matrix.arch.{platform,suffix,runs_on}.
          ARCHES_JSON='[
            {"platform": "linux/amd64", "suffix": "amd64", "runs_on": "ubuntu-latest"},
            {"platform": "linux/arm64", "suffix": "arm64", "runs_on": "ubuntu-24.04-arm"}
          ]'
          BUILD_MATRIX=$(echo "$MERGE_MATRIX" | jq -c --argjson arches "$ARCHES_JSON" '
            [.[] as $v | $arches[] as $a | $v + {arch: $a}]
          ')

          echo "Merge matrix: $MERGE_MATRIX"
          echo "Build matrix: $BUILD_MATRIX"

          echo "merge-matrix=$MERGE_MATRIX" >> $GITHUB_OUTPUT
          echo "build-matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ${{ matrix.arch.runs_on }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.build-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Derive staging tag
        run: |
          VERSION="${{ needs.preflight.outputs.sglang-version }}"
          SGLANG_BASE="lmsysorg/sglang:${{ matrix.tag }}"
          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"

          IMAGE_TAG_BASE="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [[ -z "$IMAGE_TAG_BASE" ]]; then
            IMAGE_TAG_BASE="$VERSION"
          fi

          # Format: v0.5.7-cuda-12.9
          IMAGE_TAG="${IMAGE_TAG_BASE}-cuda-${{ matrix.cuda }}"
          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "SGLANG_BASE=$SGLANG_BASE" >> $GITHUB_ENV
          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV

          echo "Building from: $SGLANG_BASE (arch=${{ matrix.arch.suffix }})"

      - name: Build and push arch image to staging
        uses: ./.github/actions/build-arch-image
        with:
          context: external/sglang
          arch: ${{ matrix.arch.platform }}
          tag-base: ${{ env.STAGING_TAG_BASE }}
          build-args: |
            SGLANG_BASE=${{ env.SGLANG_BASE }}
          build-contexts: |
            base_image_source=.
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Live-GPU QA gate (ADR 0005), calling the reusable qa-gate.yml once per promoted
  # variant (amd64). Per-image specifics live here; the shared core lives in
  # qa-gate.yml. This image had NO gate at all until now — merge-manifests depended
  # only on build, so an image that compiled was promoted whether or not it served.
  qa:
    needs: [preflight, build]
    if: needs.preflight.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'sglang' }}
      tag: ${{ inputs.CUSTOM_IMAGE_TAG || needs.preflight.outputs.sglang-version }}-cuda-${{ matrix.cuda }}-amd64
      template_dir: external/sglang/templates/sglang-qa
      label: base-image-qa-sglang
      log_paths: "/var/log/portal/sglang.log"
      # CI-side half of the template's INSTANCE_TEST_REQUIRE_PASS (ADR 0019/0031).
      # Declared in BOTH places on purpose: the runner enforces it in-instance, and
      # this enforces it against the verdict payload, so a template edit that drops
      # the env var still cannot produce a passing gate.
      require_tests: "base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries sglang.d/10-sglang-serving sglang.d/12-sglang-contract"
      # ADR 0029 condition 5: the redraw rule is not forked per image.
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Serverless cell (ADR 0031 decision 3), on every CUDA variant. An ordinary
  # on-demand rental differing only by SERVERLESS=true and the worker env that
  # entails; the autoscaler path itself is out of scope.
  #
  # BACKEND is deliberately ABSENT: the image bakes ENV BACKEND=sglang, and that bake
  # is the claim under test. Setting it here would override it with docker -e and
  # test the template instead. It also fails loudly if the bake is missing —
  # start_server.sh resolves workers/$BACKEND/worker.py, an empty BACKEND matches
  # nothing, and 20-serverless-pyworker reds on "nothing is listening on :3000".
  #
  # IT DOES NOT GATE YET (ADR 0006 condition 2's ramp). merge-manifests lists it in
  # `needs` so it is ORDERED ahead of the production approval prompt — a human is
  # never asked to approve before this cell's evidence exists — but its `if` does not
  # require the result. Promote it by adding needs.qa-serverless.result == 'success'
  # to that `if` after two consecutive green runs.
  qa-serverless:
    needs: [preflight, build]
    if: needs.preflight.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'sglang' }}
      tag: ${{ inputs.CUSTOM_IMAGE_TAG || needs.preflight.outputs.sglang-version }}-cuda-${{ matrix.cuda }}-amd64
      template_dir: external/sglang/templates/sglang-qa
      label: base-image-qa-sglang-serverless
      log_paths: "/var/log/portal/sglang.log /var/log/portal/pyworker.log /workspace/pyworker.log /workspace/debug.log"
      # THE ONLY PRODUCT DIFFERENCE FROM THE STANDARD CELL IS SERVERLESS=true. That is
      # the whole claim of the serverless-enablement work — one template, one env var
      # — so a gate that quietly needed three more variables would not be testing it.
      #
      # MODEL_NAME is GONE and its absence is now part of the test. pyworker's
      # core.py resolves the benchmark model from MODEL_NAME, VLLM_MODEL,
      # SGLANG_MODEL or LLAMA_MODEL, precisely so an on-demand template that sets only
      # the engine var works unchanged in serverless. The template sets the engine var,
      # so passing MODEL_NAME here would paper over that resolution instead of
      # exercising it. If it fails, the benchmark raises and 20-serverless-pyworker
      # reds on a missing score — loudly, which is what we want.
      #
      # MODEL_LOG is GONE for the same reason: the worker's EngineDefaults already
      # carry this engine's log path, and passing it tested our value rather than the
      # image's.
      #
      # INSTANCE_TEST_REQUIRE_PASS stays, and is NOT a product difference. No customer
      # template carries it — it is how the gate asserts, and the serverless cell has
      # more tests that must have passed (base/85 and the pyworker score) because in
      # this mode they are no longer inert. Keeping it here is the difference between
      # QA scaffolding and the template's own configuration.
      # THE AUTOSCALER'S OWN SIGNALS, NOT SERVERLESS=true (ADR 0034). ONE serverless cell,
      # exercising the INFERRED path, because that is the strictly harder one: it requires
      # 01-detect-serverless.sh to run, decide and EXPORT SERVERLESS — and the export to
      # reach the test runner, since `is_serverless` reads the variable, not the marker
      # file. A declared SERVERLESS=true arrives via docker -e and is a SUBSET of that, so
      # a cell passing here would pass there.
      #
      # It therefore doubles as the per-image canary for "did this image actually inherit
      # the stage": a stale base pin yields an image with no 01-detect-serverless.sh,
      # where a DECLARED cell still passes and this one cannot.
      #
      # The declared branch keeps its coverage where it is cheap and exact —
      # tools/imagegen/tests/test_detect_serverless_sh.py drives the real script through
      # every branch, including an explicit true and an explicit false, with no GPU.
      #
      # Both sentinels are self-evidently fake and safe in plaintext: the stage tests
      # PRESENCE only and never reads either value, and .invalid cannot resolve. The
      # MASTER_TOKEN here is not a credential and must never be replaced with one.
      #
      # Every test named below opens with `is_serverless || test_skip`, and runner.sh turns
      # a skipped REQUIRED test into REQUIRED-FAIL — a broken inference is a red cell.
      extra_env: |
        MASTER_TOKEN=qa-detection-sentinel-not-a-real-token
        REPORT_ADDR=https://qa-detection-sentinel.invalid
        # UNSECURED skips the pubkey gate, and it undoes a QA-only side effect rather
        # than weakening the test. REPORT_ADDR above is an unresolvable sentinel (L079),
        # so `GET ${REPORT_ADDR}/pubkey/` CANNOT succeed — five attempts, then
        # `backend_errored`, on every cell, always. The gate therefore proves nothing
        # here: it is guaranteed to fail for a reason QA created, and skipping it masks
        # nothing observable, because no configuration of ours could make it pass.
        #
        # What it costs without this: the worker benchmarks fine (`.has_benchmark` is
        # written at backend.py:857, BEFORE the gate at :915 — which is why these cells
        # were already green) and then dies at the last step, so every QA worker ends
        # its life `errored` and each cell burns ~60s waiting for a key that cannot
        # arrive. Measured on a live 2x5090 debug box: detection worked, sglang served,
        # benchmark 995.55 written, then "Cannot mark model as loaded: pubkey fetch
        # failed".
        #
        # SCOPE: QA scaffolding, and it must never reach a template — there it would
        # disable request-signature verification on a live worker (__check_signature
        # returns True immediately). It lives in extra_env precisely because a
        # template.yml is what a production template gets copied from. Gated by L080.
        UNSECURED=true
        SERVERLESS_DETECT_EXPECT=detected
        INSTANCE_TEST_REQUIRE_PASS=base/15-boot-markers base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries base/85-serverless-services sglang.d/10-sglang-serving sglang.d/12-sglang-contract sglang.d/20-serverless-pyworker
      require_tests: "base/15-boot-markers base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries base/85-serverless-services sglang.d/10-sglang-serving sglang.d/12-sglang-contract sglang.d/20-serverless-pyworker"
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # start_server.sh: `[ -n "$BACKEND" ] && [ -z "$HF_TOKEN" ] && report_error_and_exit`.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  merge-manifests:
    # qa-serverless is in `needs` to ORDER it and absent from the `if` so it cannot
    # BLOCK. `!cancelled()` is what stops a failed serverless cell skipping this job,
    # and it also switches off the implicit "skip if any needed job failed" — so the
    # two results that MUST still block are named explicitly.
    needs: [preflight, build, qa, qa-serverless]
    if: >-
      !cancelled()
      && needs.preflight.outputs.should-run == 'true'
      && needs.build.result == 'success'
      && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.merge-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        run: |
          VERSION="${{ needs.preflight.outputs.sglang-version }}"
          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"

          IMAGE_TAG_BASE="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [[ -z "$IMAGE_TAG_BASE" ]]; then
            IMAGE_TAG_BASE="$VERSION"
          fi

          IMAGE_TAG="${IMAGE_TAG_BASE}-cuda-${{ matrix.cuda }}"
          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"
          PROD_TAG="${{ secrets.DOCKERHUB_NAMESPACE }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV
          echo "PROD_TAG=$PROD_TAG" >> $GITHUB_ENV

          MATRIX_ID=$(echo "${{ matrix.tag }}" | md5sum | cut -c1-8)
          echo "MATRIX_ID=$MATRIX_ID" >> $GITHUB_ENV

      - name: Assemble multi-arch index in production
        uses: ./.github/actions/merge-arch-manifests
        with:
          target-tag: ${{ env.PROD_TAG }}
          source-tag-base: ${{ env.STAGING_TAG_BASE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record merged manifest tag
        run: |
          mkdir -p built-tags
          echo "${{ env.PROD_TAG }}" > built-tags/tag-${{ env.MATRIX_ID }}.txt

      - name: Upload manifest tag
        uses: actions/upload-artifact@v4
        with:
          name: built-tag-${{ env.MATRIX_ID }}
          path: built-tags/
          retention-days: 1

  collect-tags:
    needs: [preflight, build, merge-manifests]
    if: always() && needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download all tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: built-tag-*
          path: all-tags/
          merge-multiple: true

      - name: Aggregate tags
        id: collect
        run: |
          if [[ -d all-tags ]] && [[ "$(ls -A all-tags 2>/dev/null)" ]]; then
            TAGS=$(cat all-tags/*.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found tags: $TAGS"
          else
            echo "::warning::No tags found - build may have failed"
            TAGS="[]"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  notify:
    needs: [preflight, build, qa, qa-serverless, merge-manifests, collect-tags]
    if: always() && needs.preflight.outputs.should-run == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      build-result: ${{ needs.merge-manifests.result }}
      # Distinct failure labels from AGGREGATED .result (never matrix .outputs), so a
      # reader can tell "the image did not build" from "the image built and does not
      # serve" from "promotion failed". Empty on success -> notify-slack renders its
      # default. The serverless clause sits AFTER promotion and leads with "promoted",
      # because that cell does not gate: without it a red serverless cell would mark
      # the run failed while merge-manifests had promoted, and Slack would read
      # "Successful" beside a failed run. Delete that clause when the cell becomes
      # blocking.
      # "PROMOTED" IS AN ALLOWLIST ON merge-manifests SUCCEEDING, not a fall-through.
      # This expression used to enumerate failure states and fall through to the
      # success text keyed on `qa.outputs.gated` — "did a live test run" — which says
      # nothing about whether anything shipped. `merge-manifests` ending 'skipped' or
      # 'cancelled' is not 'failure', so it fell through and Slack announced a
      # promotion that did not happen. Measured 2026-08-27: three branch dispatches
      # cancelled at the production approval gate, every QA cell green, Slack saying
      # "SGLang promoted — live-GPU QA passed" beside a red run card.
      headline: ${{ (needs.build.result != 'success' && 'SGLang build failed') || (needs.qa.result == 'failure' && 'SGLang QA FAILED on real GPU — not promoted') || (needs.merge-manifests.result == 'failure' && 'SGLang promotion (manifest merge) failed') || (needs.merge-manifests.result != 'success' && 'SGLang NOT promoted — promotion did not run') || (needs.qa-serverless.result == 'failure' && 'SGLang promoted — but the ADVISORY serverless cell FAILED (not gating yet)') || (needs.qa.outputs.gated == 'true' && 'SGLang promoted — live-GPU QA passed') || '' }}
      image-name: "SGLang"
      image-ref: ${{ needs.preflight.outputs.sglang-version }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
