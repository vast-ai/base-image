# Promote staging base images to production by retagging (no rebuild)
# Retags dated staging images to clean production tags
# All promotions run sequentially in a single job to ensure ordering
# Required repository secrets:
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN
# DOCKERHUB_NAMESPACE_STAGING
# DOCKERHUB_NAMESPACE
# Optional:
# SLACK_WEBHOOK_URL

name: Promote Base Image

# The approvals list shows the run NAME, not the job summary — a reviewer clicking
# "approve" from the notification never sees the flip/hold table unless they open
# the run. Put the decisive facts in the title itself.
run-name: >-
  Promote base ${{ inputs.STAGING_DATE }}${{ inputs.DRY_RUN == true && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      STAGING_DATE:
        description: "Date suffix to promote (e.g. 2026-03-06)"
        required: true
        type: string
      FILTER:
        description: "Filter configs by pattern (e.g. cuda-12, stock)"
        required: false
        default: ""
      DRY_RUN:
        description: "Print what would be promoted without promoting"
        required: false
        default: false
        type: boolean
concurrency:
  group: base-image-promote
  cancel-in-progress: false

jobs:
  generate-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.configs.outputs.configs }}
      all-configs: ${{ steps.configs.outputs.all-configs }}
      mini-tags: ${{ steps.configs.outputs.mini-tags }}
    steps:
      # Needed for configs/base-image.json — this job previously ran with no checkout.
      - uses: actions/checkout@v4

      - name: Generate filtered config list
        id: configs
        run: |
          FILTER="${{ inputs.FILTER }}"
          # Config table lives in configs/base-image.json (ADR 0019) — it was inline in three workflows, so a patch bump had to land three times and a miss was silent. jq preserves array order, which the auto-tag dance depends on.
          mapfile -t ALL_CONFIGS < <(jq -r '.configs[] | "\(.key)|\(.tag_template)|\(.default_python)"' "$GITHUB_WORKSPACE/configs/base-image.json")

          CONFIGS_JSON="[]"
          ALL_CONFIGS_JSON="[]"

          for config in "${ALL_CONFIGS[@]}"; do
            IFS='|' read -r key tag_template default_python <<< "$config"

            ENTRY_JSON=$(jq -nc \
              --arg key "$key" \
              --arg tag_template "$tag_template" \
              --arg default_python "$default_python" \
              '{key: $key, tag_template: $tag_template, default_python: $default_python}')

            ALL_CONFIGS_JSON=$(echo "$ALL_CONFIGS_JSON" | jq -c ". + [${ENTRY_JSON}]")

            if [[ -n "$FILTER" && "$key" != *"$FILTER"* ]]; then
              continue
            fi

            CONFIGS_JSON=$(echo "$CONFIGS_JSON" | jq -c ". + [${ENTRY_JSON}]")
          done
          # Mini configs from the same table.
          mapfile -t MINI_CONFIGS < <(jq -r '.mini[] | "\(.key)|\(.mini_tag)"' "$GITHUB_WORKSPACE/configs/base-image.json")

          MINI_TAGS_JSON="[]"
          for mini_config in "${MINI_CONFIGS[@]}"; do
            IFS='|' read -r key mini_tag <<< "$mini_config"
            if [[ -n "$FILTER" && "$key" != *"$FILTER"* && "mini" != *"$FILTER"* ]]; then
              continue
            fi
            MINI_TAGS_JSON=$(echo "$MINI_TAGS_JSON" | jq -c \
              --arg key "$key" \
              --arg mini_tag "$mini_tag" \
              '. + [{"key": $key, "mini_tag": $mini_tag}]')
          done

          {
            echo "configs<<CONFIGS_EOF"
            echo "${CONFIGS_JSON}"
            echo "CONFIGS_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "all-configs<<ALL_CONFIGS_EOF"
            echo "${ALL_CONFIGS_JSON}"
            echo "ALL_CONFIGS_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "mini-tags<<MINI_TAGS_EOF"
            echo "${MINI_TAGS_JSON}"
            echo "MINI_TAGS_EOF"
          } >> $GITHUB_OUTPUT
          echo "Configs: $(echo "$CONFIGS_JSON" | jq length)"
          echo "Mini tags: $(echo "$MINI_TAGS_JSON" | jq length)"

  # ── QA phase (ADR 0019) ────────────────────────────────────────────────
  # Runs BEFORE the approval gate and carries no `environment:`, so the twelve
  # cells complete unattended and the reviewer sees their verdicts at the moment
  # they are asked to approve. The prod write stays behind `environment: production`
  # exactly as before.

  preflight:
    needs: generate-configs
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the gate can actually run
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          NS_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          NS_PROD: ${{ secrets.DOCKERHUB_NAMESPACE }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          STAGING_DATE: ${{ inputs.STAGING_DATE }}
        run: |
          # Every secret the run needs, checked before a human is asked to approve
          # and before any GPU spend — a missing namespace otherwise surfaces as a
          # malformed ref deep into the promote.
          missing=()
          [ -z "${NS_STAGING}" ] && missing+=("DOCKERHUB_NAMESPACE_STAGING")
          [ -z "${NS_PROD}" ] && missing+=("DOCKERHUB_NAMESPACE")
          [ -z "${DH_USER}" ] && missing+=("DOCKERHUB_USERNAME")
          [ -z "${DH_TOKEN}" ] && missing+=("DOCKERHUB_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing required secrets: ${missing[*]}"
            exit 1
          fi
          # STAGING_DATE is free dispatch text that ends up in ~70 registry refs.
          # Pin its shape here, where checking costs nothing, rather than finding
          # out via a malformed ref after the QA phase has already been paid for.
          if [[ ! "${STAGING_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::STAGING_DATE must be YYYY-MM-DD, got '${STAGING_DATE}'"
            exit 1
          fi
          # Fail here, before a human is asked to approve anything, rather than
          # letting twelve cells skip and report green (ADR 0019 cond 3).
          if [ -z "${VAST_API_KEY}" ]; then
            echo "::error::VAST_API_KEY is not set — the QA gate cannot run, so no -auto tag may move. Fix the secret and re-dispatch; there is deliberately no bypass (ADR 0019). To move a tag by hand: promote first (dated tags land regardless), then use the Move Base Auto Tag workflow."
            exit 1
          fi
          echo "QA gate ready"

  resolve-digests:
    needs: [generate-configs, preflight]
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    outputs:
      qa-matrix: ${{ steps.plan.outputs.qa-matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pin the digests this run will promote
        id: plan
        env:
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          NAMESPACE_PROD: ${{ secrets.DOCKERHUB_NAMESPACE }}
          STAGING_DATE: ${{ inputs.STAGING_DATE }}
          CONFIGS: ${{ needs.generate-configs.outputs.configs }}
          MINI_TAGS: ${{ needs.generate-configs.outputs.mini-tags }}
        run: |
          set -euo pipefail
          # The manifest of record. Everything downstream — what QA tests, what the
          # approver sees, what gets copied — is keyed on these digests, NOT on the
          # dated tag. Staging tags are mutable (a same-day partial rebuild rewrites
          # them), so a tag-keyed pipeline can certify one set of bits and ship another.
          echo '{"configs":[],"mini":[]}' > manifest.json
          mapfile -t PYTHON_VERSIONS < <(jq -r '.python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          mapfile -t MINI_PYTHON_VERSIONS < <(jq -r '.mini_python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          [ "${#PYTHON_VERSIONS[@]}" -gt 0 ] || { echo "::error::no python_versions in the config table"; exit 1; }
          COUNT=$(echo "$CONFIGS" | jq length)
          for ((i=0; i<COUNT; i++)); do
            key=$(echo "$CONFIGS" | jq -r ".[$i].key")
            tpl=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            dp=$(echo "$CONFIGS"  | jq -r ".[$i].default_python")
            dptag="py${dp//./}"
            # The auto tag points at the DEFAULT-PYTHON index; that is the artifact
            # whose digest matters, so it is the one QA tests and the one recorded as
            # target_digest.
            src="${NAMESPACE_STAGING}/base-image:${tpl}-${dptag}-${STAGING_DATE}"
            target=$(crane digest "$src" 2>/dev/null || echo "")
            # ...but EVERY artifact this run copies is pinned here too. Previously only
            # default-python was pinned and the other four pythons were copied by TAG at
            # write time, justified by "the drift check already aborted if the dated
            # source moved" — which is false: the drift check only re-resolves the
            # default-python tag. That used default-python as a PROXY for "the whole
            # config was rebuilt"; it holds for an all-or-nothing rebuild and breaks for
            # a FILTERed or partially re-run one. Pinning everything means the mutable
            # tag is read exactly once, and nothing afterwards can change what ships.
            pys="{}"
            for pv in "${PYTHON_VERSIONS[@]}"; do
              pt="py${pv//./}"
              d=$(crane digest "${NAMESPACE_STAGING}/base-image:${tpl}-${pt}-${STAGING_DATE}" 2>/dev/null || echo "")
              pys=$(jq -c --arg k "$pt" --arg v "$d" '.[$k]=$v' <<<"$pys")
            done
            auto=$(echo "$tpl" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            current=""
            if [ -n "$auto" ]; then
              current=$(crane digest "${NAMESPACE_PROD}/base-image:cuda-${auto}-auto" 2>/dev/null || echo "")
            fi
            # Major-baseline driver floor, raised per config at rent time. gte is a
            # LOWER bound: an 11.8 image is happy on a much newer driver, which is
            # where most of the fleet now is.
            # EXACT MINOR, derived — not a major baseline.
            #
            # This used to floor a whole major (13.* -> 13.0). The effect was that
            # the NEWEST images were tested almost exclusively on OLD drivers: at
            # a 13.0 floor, 79% of the market qualifies and it is dominated by
            # 580/590/595, so a cuda-13.3 image was routinely validated on a
            # driver that does not natively support 13.3 and reaches it through
            # forward compat. The native path — the one a customer on a current
            # driver actually takes — went untested. That is the shape of gap the
            # 610 rename got through.
            #
            # Measured supply at each exact floor (verified, rentable, meeting the
            # other base-qa floors; n=497): 12.1 99.8%, 12.4 96.6%, 12.6 94.0%,
            # 12.8 89.5%, 12.9 80.1%, 13.0 78.9%, 13.1 45.1%, 13.2 36.4%,
            # 13.3 4.2% (21 offers). So the thinness argument for a major baseline
            # holds for exactly one config — the newest minor — and only until the
            # market catches up. For the other nine it cost driver coverage and
            # bought nothing.
            #
            # On the newest config the exact floor also selects the driver branch
            # that actually ships that CUDA (13.3 -> 610), which is coverage the
            # gate could not otherwise get: driver_version is not a usable search
            # filter on the API (every form returns zero), and ADR 0024 rejected
            # pinning it anyway. cuda_max_good is a capability floor, not a driver
            # pin, so this is the sanctioned way to reach it.
            #
            # A thin cell is absorbed by the gate, not by weakening the floor:
            # no_offers is inconclusive and retried with jitter. If 13.3 starts
            # holding on supply rather than on defects, that is the signal to
            # revisit (ADR 0019 amendment, condition 4) — not to widen this.
            case "$auto" in
              # NO auto version = no -auto tag = never QA'd. The stock-* configs
              # are this: `auto` is parsed off a `cuda-` prefix they do not have,
              # so it is empty, and `qa-set` already excludes them by
              # `.auto_version != ""`. They reached the fail-closed arm below and
              # aborted the whole promotion before QA — latent since the stock
              # configs and this case statement arrived together in #239, and hit
              # the first time a promote ran with both on main.
              "") floor="" ;;
              [0-9]*.[0-9]*.[0-9]*) floor="${auto%.*}" ;;   # 13.3.1 -> 13.3
              [0-9]*.[0-9]*)        floor="$auto" ;;        # 11.8   -> 11.8
              *)
                # FAIL, do not default. The floor is now DERIVED, so a new CUDA
                # version cannot silently inherit a stale one — but a tag template
                # whose version does not parse as X.Y[.Z] would yield an empty or
                # malformed floor, and QA would then be free to rent a host whose
                # driver cannot run the image. That fails closed (the GPU tests go
                # red, the tag holds) but it presents as a broken IMAGE, sending
                # whoever is on call to debug a build that is fine. Name the real
                # cause instead.
                echo "::error::${key}: CUDA major of '${auto}' has no driver floor."
                echo "::error::Add a '${auto%%.*}.*) floor=X ;;' branch to this case"
                echo "::error::statement (see docs/runbooks/new-cuda-version.md)."
                exit 1 ;;
            esac
            manifest_entry=$(jq -nc --arg k "$key" --arg t "$tpl" --arg a "$auto" \
              --arg tg "$target" --arg cu "$current" --arg dp "$dptag" --arg fl "$floor" \
              --argjson py "$pys" \
              '{key:$k, tag_template:$t, auto_version:$a, target_digest:$tg,
                current_digest:$cu, default_py:$dp, floor:$fl, py_digests:$py}')
            jq --argjson e "$manifest_entry" '.configs += [$e]' manifest.json > m.tmp && mv m.tmp manifest.json
          done
          # Mini variants carry no auto tag and are never QA'd, but this run DOES copy
          # them to prod, so they are pinned on the same principle.
          MCOUNT=$(echo "$MINI_TAGS" | jq length)
          for ((i=0; i<MCOUNT; i++)); do
            mkey=$(echo "$MINI_TAGS" | jq -r ".[$i].key")
            mtag=$(echo "$MINI_TAGS" | jq -r ".[$i].mini_tag")
            mpys="{}"
            for pv in "${MINI_PYTHON_VERSIONS[@]}"; do
              pt="py${pv//./}"
              d=$(crane digest "${NAMESPACE_STAGING}/base-image:${mtag}-${pt}-${STAGING_DATE}" 2>/dev/null || echo "")
              mpys=$(jq -c --arg k "$pt" --arg v "$d" '.[$k]=$v' <<<"$mpys")
            done
            entry=$(jq -nc --arg k "$mkey" --arg t "$mtag" --argjson py "$mpys" '{key:$k, mini_tag:$t, py_digests:$py}')
            jq --argjson e "$entry" '.mini += [$e]' manifest.json > m.tmp && mv m.tmp manifest.json
          done
          echo "pinned $(jq '[.configs[].py_digests[], .mini[].py_digests[]] | map(select(. != "")) | length' manifest.json) artifacts by digest"

          echo "--- manifest ---"; jq -r '.configs[] | "  \(.key): target=\(.target_digest[0:19]) current=\(.current_digest[0:19]) floor=\(.floor)"' manifest.json

          # QA only the configs whose auto tag would actually FLIP. An unchanged
          # digest is re-pushed for ordering, not re-shipped, so renting a GPU to
          # re-certify identical bits is pure cost — and would make an unrelated
          # flake block a no-op.
          jq -c '[.configs[] | select(.auto_version != "" and .target_digest != "" and .target_digest != .current_digest)]' manifest.json > qa-set.json
          echo "qa-matrix=$(jq -c '{include: .}' qa-set.json)" >> "$GITHUB_OUTPUT"
          echo "cells to test: $(jq length qa-set.json)"

      - name: Publish run-scoped QA refs
        env:
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
        run: |
          set -euo pipefail
          # Pin each tested artifact to an immutable, run-scoped tag. QA then tests
          # THAT, so a concurrent rebuild cannot swap the bits under the test. The
          # name carries no run_attempt: a re-run of failed jobs must find the same
          # refs (resolve-digests will not re-run, having succeeded).
          jq -r '.configs[] | select(.target_digest != "") | "\(.key) \(.target_digest)"' manifest.json |
          while read -r key digest; do
            ref="${NAMESPACE_STAGING}/base-image:qa-${{ github.run_id }}-${key}"
            crane copy "${NAMESPACE_STAGING}/base-image@${digest}" "$ref"
            echo "  $ref -> ${digest:0:19}…"
          done

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: promotion-manifest
          path: manifest.json
          retention-days: 7

  qa:
    needs: [generate-configs, resolve-digests]
    if: ${{ !inputs.DRY_RUN && needs.resolve-digests.outputs.qa-matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      # Bounded against the single-key QA account. ADR 0005 cond 6's account-aware
      # semaphore is still the proper fix; until then this plus the client's 429
      # backoff is the interim, and promotions are staggered off the other gates' crons.
      #
      # 4, from measurement (run 31170473940, 2026-08-07): 10 cells, median 3.3 min,
      # slowest 13.6 min, ~43 min of cell time, zero 429s at max-parallel 2. The
      # slowest single cell sets a ~13.6 min floor, so 4 captures essentially all the
      # available speedup and anything higher buys nothing — 2->4 saves ~10 min,
      # 4->10 saves zero. Not raised further because the cost is not only rate
      # limits: concurrent cells query the same thin offer market, and two cells
      # racing for one box surfaces as bad_instance (exit 3), which is deliberately
      # never retried. On a thin day more parallelism converts passes into holds.
      max-parallel: 4
      matrix: ${{ fromJson(needs.resolve-digests.outputs.qa-matrix) }}
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: base-image
      tag: qa-${{ github.run_id }}-${{ matrix.key }}
      template_dir: templates/base-qa
      label: base-image-qa-base
      require_key: true
      require_tests: "base/36-home-env-sync base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries"
      set_filters: "cuda_max_good.gte=${{ matrix.floor }}"
      retries: 2
      # Base QA pulls a 10-20 GB image and downloads no model; observed passing
      # cells complete the ENTIRE test in 2-8 min. The client's 40 min default is
      # calibrated for a derivative fetching a 100 GB model, so here it means a
      # slow host burns 40 min per launch attempt before the client moves on —
      # which is exactly what happened on run 31174508116. 15 min is still ~2x the
      # slowest observed full cell.
      poll_timeout: "900"
      max_price: "1.00"
      timeout: "2400"
      extra_env: |
        PROV_TIMEOUT=900
        INSTANCE_TEST_DEFAULT_TIMEOUT=900
        VLLM_HEALTH_TIMEOUT=900
      evidence_name: qa-evidence-${{ matrix.key }}
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  qa-summary:
    needs: [resolve-digests, qa]
    # always(): a red cell must still produce the decision table — that is exactly
    # the run where the approver needs to see which tags are being held.
    if: ${{ always() && !inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    outputs:
      holds: ${{ steps.decide.outputs.holds }}
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with: { name: promotion-manifest, path: . }
      - uses: actions/download-artifact@v4
        with: { pattern: qa-evidence-*, path: evidence, merge-multiple: false }
        continue-on-error: true

      - name: Decide which auto tags may flip
        id: decide
        run: |
          set -euo pipefail
          # Collapse each cell's verdict payload into {config: {verdict, digest}}.
          # Each cell's verdict comes from qa_verdict.py — the SAME function the cell
          # itself ran, with the same required-tests list. Re-deriving a predicate here
          # from (state, got_result_event) would silently drop the required-tests
          # assertion, which is the only BLOCK class those two fields cannot see: a
          # GPU-trio self-skip yields state=passed + got_result_event=true. Since a red
          # cell does not fail this job (holds are not aborts), that weaker copy would
          # have been the sole arbiter — reopening the exact skip-as-pass hole the gate
          # exists to close.
          #
          # The tested digest is re-resolved from the run-scoped alias tag rather than
          # trusted from the payload, so the link is checked at the point of use.
          export STAGING_NS="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}"
          export RUN_ID="${{ github.run_id }}"
          export REQUIRE_TESTS="base/36-home-env-sync base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries"
          python - <<'PY' > evidence.json
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, "tools/template_manager")
          from qa_verdict import classify, parse_required

          out = {}
          root = pathlib.Path("evidence")
          ns, run_id = os.environ["STAGING_NS"], os.environ["RUN_ID"]
          required = parse_required(os.environ["REQUIRE_TESTS"])
          for d in sorted(root.glob("qa-evidence-*")) if root.is_dir() else []:
              key = d.name[len("qa-evidence-"):]
              raw_file = d / "qa-raw.json"
              payload, verdict, reason = None, "block", "no verdict payload for this cell"
              if raw_file.is_file():
                  lines = [l for l in raw_file.read_text().splitlines()
                           if l.strip().startswith("{")]
                  if lines:
                      payload = json.loads(lines[-1])
                      verdict, reason = classify(payload.get("exit_code", 1), payload, required)
              ref = f"{ns}/base-image:qa-{run_id}-{key}"
              try:
                  digest = subprocess.run(["crane", "digest", ref], capture_output=True,
                                          text=True, timeout=120).stdout.strip()
              except Exception:
                  digest = ""
              out[key] = {"verdict": verdict, "reason": reason, "digest": digest}
          print(json.dumps(out, indent=2))
          PY
          cat evidence.json

          python tools/template_manager/verify_qa_evidence.py             --manifest manifest.json --evidence evidence.json             --out decisions.json --summary summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # ALL-OR-NOTHING. If any config holds, NOTHING flips.
          #
          # This supersedes ADR 0019's "flip passing / hold failing". That rule was
          # chosen because atomic gating is p^n in per-cell reliability (~54% clean
          # at 12 cells x 95%), which drives operators to route around the gate. The
          # answer to that is not partial promotion, it is removing the flakiness:
          # qa-gate.yml now draws a FRESH HOST on any failure and excludes the
          # machine that failed (ADR 0029), which is what that argument was really
          # about.
          #
          # What partial promotion assumed, and should not have: that a red cell is
          # evidence about one image. Every config shares the same ROOT overlay and
          # the same boot path, so a genuine defect found on cuda-12.6 is evidence
          # about all twelve. Flipping the other eleven on the theory that only one
          # is affected is the least safe reading of that evidence.
          #
          # Re-running only the failed jobs is cheap and keeps the batch honest.
          _holds=$(jq '[.[] | select(.decision=="hold")] | length' decisions.json)
          if [ "$_holds" -gt 0 ]; then
            echo "::error::${_holds} config(s) held — NO auto tag will flip this run (all-or-nothing)."
            echo "::error::Re-run the failed QA job(s), or re-dispatch, once the cause is understood."
            jq -r '.[] | select(.decision=="hold") | "  hold \(.auto_tag // .key): \(.reason)"' decisions.json || true
            # Rewrite every FLIP to a hold so the promote job cannot move anything.
            # Only flips: `n/a` entries are configs with no auto tag (the stock-*
            # pair) and must stay n/a, and existing holds keep their real reason —
            # the cause is more useful than the consequence.
            jq '[.[] | if .decision == "flip"
                       then .decision = "hold"
                          | .reason = "held: another config in this batch did not clear QA (all-or-nothing)"
                       else . end]' decisions.json > d.tmp && mv d.tmp decisions.json
            _holds=$(jq '[.[] | select(.decision=="hold")] | length' decisions.json)
          fi
          echo "holds=${_holds}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with: { name: promotion-decisions, path: "decisions.json", retention-days: 7 }


  promote:
    needs: [generate-configs, qa-summary]
    # This job IS reachable after a collapsed QA phase — qa-summary carries
    # always(), so it succeeds regardless of the cells' results and promote becomes
    # eligible. That is deliberate and safe, but NOT because of the job graph: with
    # no evidence artifacts, every config's decision is `hold`, so nothing flips and
    # the approval summary says so. Safety here comes from the decisions, not from
    # unreachability — do not weaken the hold logic on the belief that the graph
    # already blocks this case.
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      # The gate's decisions, computed BEFORE the approval was requested. The
      # reviewer approved a specific set of flips and holds; this is that record.
      - uses: actions/download-artifact@v4
        with: { name: promotion-decisions, path: . }
      - uses: actions/download-artifact@v4
        with: { name: promotion-manifest, path: . }

      - name: Re-verify the decisions still describe staging
        env:
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          # Via env:, never interpolated into the script. A dispatch input is free
          # text; `${{ }}` splices it into bash BEFORE the shell sees it, so a value
          # containing $(...) would execute here — in the production-approved job,
          # and before the drift check it is part of could complete.
          STAGING_DATE: ${{ inputs.STAGING_DATE }}
        run: |
          set -euo pipefail
          echo "--- decisions approved for this run ---"
          jq -r '.[] | select(.decision != "n/a") | "  \(.decision)\t cuda-\(.auto_version)-auto\t \(.reason)"' decisions.json
          # Approval can sit for hours, and the DATED staging tag is mutable — a
          # same-day partial rebuild rewrites it. That is the ref this job copies, so
          # it is the ref that must be re-checked. (Re-resolving the run-scoped alias
          # instead would be a tautology: this run created it at that digest and
          # nothing else writes it, so it can never disagree.)
          drift=0
          while read -r key tpl dp digest; do
            [ -z "$digest" ] && continue
            src="${NAMESPACE_STAGING}/base-image:${tpl}-${dp}-${STAGING_DATE}"
            now=$(crane digest "$src" 2>/dev/null || echo "")
            if [ "$now" != "$digest" ]; then
              echo "::error::${key}: approved ${digest:0:19}… but ${src} now resolves to ${now:0:19}…"
              drift=1
            fi
          done < <(jq -r '.configs[] | select(.target_digest != "") | "\(.key) \(.tag_template) \(.default_py) \(.target_digest)"' manifest.json)
          [ "$drift" -eq 0 ] || { echo "::error::staging moved after the plan was approved — aborting before any prod write"; exit 1; }
          echo "staging still matches the approved plan (default-python refs)"
          # Every other artifact is copied by its pinned digest, so a moved tag
          # there cannot change what ships — but it does mean somebody rebuilt
          # mid-promotion, and the operator should know the dated prod tags will
          # carry the PINNED bits rather than what staging shows now. Warn rather
          # than abort: the pinned digests are exactly what was planned.
          moved=0
          while read -r mkey mtpl mdpy mpytag mdigest; do
            [ -z "$mdigest" ] && continue
            [ "$mpytag" = "$mdpy" ] && continue
            now=$(crane digest "${NAMESPACE_STAGING}/base-image:${mtpl}-${mpytag}-${STAGING_DATE}" 2>/dev/null || echo "")
            if [ "$now" != "$mdigest" ]; then
              echo "::warning::${mkey} ${mpytag}: staging tag now ${now:0:19}… but promoting the pinned ${mdigest:0:19}…"
              moved=$((moved+1))
            fi
          done < <(jq -r '.configs[] | . as $c | .py_digests | to_entries[] | "\($c.key) \($c.tag_template) \($c.default_py) \(.key) \(.value)"' manifest.json)
          [ "$moved" -eq 0 ] && echo "no non-default-python staging tags moved either" || true

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote all images sequentially
        env:
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          NAMESPACE_PROD: ${{ secrets.DOCKERHUB_NAMESPACE }}
          STAGING_DATE: ${{ inputs.STAGING_DATE }}
          CONFIGS: ${{ needs.generate-configs.outputs.configs }}
          ALL_CONFIGS: ${{ needs.generate-configs.outputs.all-configs }}
          MINI_TAGS: ${{ needs.generate-configs.outputs.mini-tags }}
        run: |
          set -euo pipefail
          PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          MINI_PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          mkdir -p built-tags

          # Pre-flight: every staging source we plan to promote must
          # exist. Fail fast with a full list of missing refs rather
          # than clobbering prod tags and then dying half way through.
          echo "=== Pre-flight: verifying staging sources ==="
          MISSING=()
          CONFIG_COUNT=$(echo "$CONFIGS" | jq length)
          for ((i=0; i<CONFIG_COUNT; i++)); do
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            for py_version in "${PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"
              SOURCE="${NAMESPACE_STAGING}/base-image:${tag_template}-py${py_tag}-${STAGING_DATE}"
              if crane digest "$SOURCE" >/dev/null 2>&1; then
                echo "  ok: $SOURCE"
              else
                echo "  MISSING: $SOURCE"
                MISSING+=("$SOURCE")
              fi
            done
          done
          MINI_COUNT=$(echo "$MINI_TAGS" | jq length)
          for ((i=0; i<MINI_COUNT; i++)); do
            mini_tag=$(echo "$MINI_TAGS" | jq -r ".[$i].mini_tag")
            for py_version in "${MINI_PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"
              SOURCE="${NAMESPACE_STAGING}/base-image:${mini_tag}-py${py_tag}-${STAGING_DATE}"
              if crane digest "$SOURCE" >/dev/null 2>&1; then
                echo "  ok: $SOURCE"
              else
                echo "  MISSING: $SOURCE"
                MISSING+=("$SOURCE")
              fi
            done
          done
          if [[ "${#MISSING[@]}" -gt 0 ]]; then
            echo ""
            echo "ERROR: ${#MISSING[@]} staging source(s) missing; aborting before any prod writes:"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "Pre-flight passed: all staging sources resolved."

          # Capture the current target of every auto tag BEFORE we promote.
          # We need this so the post-promotion auto-tag dance can restore
          # auto tags for configs NOT being promoted in this run (keeping
          # them pinned to their existing content while still re-pushing
          # them so they appear at the top of the tag list).
          declare -A AUTO_TARGET_PRE
          ALL_COUNT=$(echo "$ALL_CONFIGS" | jq length)
          for ((i=0; i<ALL_COUNT; i++)); do
            at_template=$(echo "$ALL_CONFIGS" | jq -r ".[$i].tag_template")
            at_cuda_ver=$(echo "$at_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$at_cuda_ver" ]] && continue
            AUTO_TAG_REF="${NAMESPACE_PROD}/base-image:cuda-${at_cuda_ver}-auto"
            if digest=$(crane digest "$AUTO_TAG_REF" 2>/dev/null); then
              AUTO_TARGET_PRE[$at_cuda_ver]="${NAMESPACE_PROD}/base-image@${digest}"
              echo "Captured existing auto tag: cuda-${at_cuda_ver}-auto @ ${digest}"
            else
              echo "No existing auto tag for cuda-${at_cuda_ver} (will be created if promoted)"
            fi
          done

          # Promote all base images (per-config, per-python)
          echo "=== Promoting base images ==="
          CONFIG_COUNT=$(echo "$CONFIGS" | jq length)
          for ((i=0; i<CONFIG_COUNT; i++)); do
            key=$(echo "$CONFIGS" | jq -r ".[$i].key")
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            default_python=$(echo "$CONFIGS" | jq -r ".[$i].default_python")

            echo ""
            echo "--- Config: ${key} ---"

            for py_version in "${PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"

              # EVERY artifact is copied by the digest pinned in resolve-digests, not by
              # the dated staging tag. Staging tags are mutable: a same-day rebuild
              # rewrites them, so a tag ref read at write time can be different bits from
              # the ones this run resolved, tested and got approved. Only default-python
              # used to be pinned; the rest were copied by tag on the (false) grounds that
              # the drift check would have caught any movement — it only re-resolves the
              # default-python tag.
              pinned=$(jq -er --arg k "$key" --arg p "py${py_tag}" \
                '.configs[] | select(.key==$k) | .py_digests[$p]' manifest.json 2>/dev/null) || pinned=""
              if [[ -z "$pinned" ]]; then
                echo "::error::no pinned digest for ${key} py${py_tag} — refusing to copy by mutable tag"
                exit 1
              fi
              SOURCE="${NAMESPACE_STAGING}/base-image@${pinned}"
              DATED_TAG="${NAMESPACE_PROD}/base-image:${tag_template}-py${py_tag}-${STAGING_DATE}"

              echo "Promoting: ${SOURCE} -> ${DATED_TAG}"
              # crane copy cross-mounts blobs registry-side (no host streaming).
              crane copy "${SOURCE}" "${DATED_TAG}"
              echo "$DATED_TAG" >> built-tags/tags.txt

              if [[ "$py_version" == "$default_python" ]]; then
                # Default python alias (no -pyXXX, but keeps date)
                DATED_ALIAS="${NAMESPACE_PROD}/base-image:${tag_template}-${STAGING_DATE}"
                echo "Aliasing: ${SOURCE} -> ${DATED_ALIAS}"
                crane copy "${SOURCE}" "${DATED_ALIAS}"
                echo "$DATED_ALIAS" >> built-tags/tags.txt
              fi
            done
          done

          # Promote mini variants
          echo ""
          echo "=== Promoting mini variants ==="
          MINI_PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          MINI_COUNT=$(echo "$MINI_TAGS" | jq length)

          for ((i=0; i<MINI_COUNT; i++)); do
            mini_key=$(echo "$MINI_TAGS" | jq -r ".[$i].key")
            mini_tag=$(echo "$MINI_TAGS" | jq -r ".[$i].mini_tag")

            for py_version in "${MINI_PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"

              pinned=$(jq -er --arg k "$mini_key" --arg p "py${py_tag}" \
                '.mini[] | select(.key==$k) | .py_digests[$p]' manifest.json 2>/dev/null) || pinned=""
              if [[ -z "$pinned" ]]; then
                echo "::error::no pinned digest for mini ${mini_key} py${py_tag} — refusing to copy by mutable tag"
                exit 1
              fi
              SOURCE="${NAMESPACE_STAGING}/base-image@${pinned}"
              DATED_TAG="${NAMESPACE_PROD}/base-image:${mini_tag}-py${py_tag}-${STAGING_DATE}"

              echo "Promoting mini: ${SOURCE} -> ${DATED_TAG}"
              crane copy "${SOURCE}" "${DATED_TAG}"

              echo "$DATED_TAG" >> built-tags/tags.txt
            done
          done

          # Auto convenience tags MUST be the most recently pushed tags.
          # The Vast.ai @vastai-automatic-tag backend resolves to the most
          # recently pushed image for a given CUDA version, so these auto
          # tags must be the final push to ensure correct ordering.
          #
          # We run a two-phase dance over the FULL unfiltered config list
          # (not just the configs promoted in this run). Phase A points
          # every auto tag at a per-tag anchor whose digest differs from
          # the auto tag's current and intended content; Phase B points
          # each back at its real target. The dance guarantees that every
          # auto tag receives two fresh pushes — even for configs not
          # promoted in this run — so their push timestamps always end
          # up newer than any dated tag. Re-pushing the same digest is
          # not sufficient: the registry only bumps the tag order when
          # the underlying manifest actually changes.

          # Build the final-target map. For configs promoted this run,
          # the real target is the new dated default-python image. For
          # configs NOT promoted, the real target is the pre-captured
          # digest ref.
          declare -A AUTO_TARGET_FINAL
          for cuda_ver in "${!AUTO_TARGET_PRE[@]}"; do
            AUTO_TARGET_FINAL[$cuda_ver]="${AUTO_TARGET_PRE[$cuda_ver]}"
          done
          for ((i=0; i<CONFIG_COUNT; i++)); do
            key=$(echo "$CONFIGS" | jq -r ".[$i].key")
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            default_python=$(echo "$CONFIGS" | jq -r ".[$i].default_python")
            cuda_ver=$(echo "$tag_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$cuda_ver" ]] && continue
            # THE GATE (ADR 0019 cond 2). This is the only line that makes the whole
            # pipeline a gate: an auto tag moves ONLY to bits that passed live-GPU QA
            # on that exact digest. A held config keeps its PRE-captured target, so its
            # tag is still re-pushed (push ordering is preserved for every tag, every
            # run) while its CONTENT does not change.
            #
            # Held, not aborted: one flaky cell out of twelve costing the whole fleet's
            # promotion is how a gate gets routed around. The rest ship; the held tag is
            # named in the approval summary.
            #
            # decisions.json is REQUIRED here — `jq -e` so a missing or malformed file
            # fails the step instead of silently yielding "" and flipping everything.
            decision=$(jq -er --arg k "$key" '.[] | select(.key==$k) | .decision' decisions.json)
            if [[ "$decision" == "hold" ]]; then
              echo "  HOLD cuda-${cuda_ver}-auto (${key}) — content unchanged this run"
              continue
            fi
            dp_tag="${default_python//.}"
            # Point the auto tag at the QA'd DIGEST, not at a tag that could have moved
            # since the plan was made (ADR 0019: "copy by digest").
            target_digest=$(jq -er --arg k "$key" '.configs[] | select(.key==$k) | .target_digest' manifest.json)
            AUTO_TARGET_FINAL[$cuda_ver]="${NAMESPACE_PROD}/base-image@${target_digest}"
          done

          # Resolve each final target to its digest so we can pick
          # anchors whose content actually differs.
          declare -A FINAL_DIGEST
          for cuda_ver in "${!AUTO_TARGET_FINAL[@]}"; do
            ref="${AUTO_TARGET_FINAL[$cuda_ver]}"
            if d=$(crane digest "$ref" 2>/dev/null); then
              FINAL_DIGEST[$cuda_ver]="$d"
            else
              echo "WARN: could not resolve digest for ${ref}; cuda-${cuda_ver}-auto will be skipped in the dance"
            fi
          done

          # Iterate auto tags in ALL_CONFIGS order and run the dance.
          echo ""
          echo "=== Auto-tag dance ==="
          for ((i=0; i<ALL_COUNT; i++)); do
            at_template=$(echo "$ALL_CONFIGS" | jq -r ".[$i].tag_template")
            cuda_ver=$(echo "$at_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$cuda_ver" ]] && continue
            TARGET_REF="${AUTO_TARGET_FINAL[$cuda_ver]:-}"
            [[ -z "$TARGET_REF" ]] && continue
            target_digest="${FINAL_DIGEST[$cuda_ver]:-}"
            [[ -z "$target_digest" ]] && continue

            # Pre-capture already stores a digest-qualified ref of the
            # form <repo>@sha256:... — extract just the digest portion.
            current_ref="${AUTO_TARGET_PRE[$cuda_ver]:-}"
            current_digest=""
            [[ -n "$current_ref" ]] && current_digest="${current_ref##*@}"

            # Pick an anchor: any other config's final target whose
            # digest differs from both current and intended.
            anchor_ref=""
            for ((j=0; j<ALL_COUNT; j++)); do
              [[ "$j" -eq "$i" ]] && continue
              cj_template=$(echo "$ALL_CONFIGS" | jq -r ".[$j].tag_template")
              cj_cuda_ver=$(echo "$cj_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
              [[ -z "$cj_cuda_ver" ]] && continue
              cand_digest="${FINAL_DIGEST[$cj_cuda_ver]:-}"
              [[ -z "$cand_digest" ]] && continue
              if [[ "$cand_digest" != "$current_digest" && "$cand_digest" != "$target_digest" ]]; then
                anchor_ref="${AUTO_TARGET_FINAL[$cj_cuda_ver]}"
                break
              fi
            done

            AUTO_TAG_REF="${NAMESPACE_PROD}/base-image:cuda-${cuda_ver}-auto"
            if [[ -z "$anchor_ref" ]]; then
              # No distinct anchor (e.g. fresh namespace, only one
              # auto tag resolvable). Fall back to a direct update so
              # correctness does not depend on the dance being
              # possible — only the tag-order optimisation is lost.
              echo "WARN: no distinct anchor for ${AUTO_TAG_REF}; falling back to direct update (tag order will not advance)"
              crane copy "${TARGET_REF}" "${AUTO_TAG_REF}"
              echo "$AUTO_TAG_REF" >> built-tags/tags.txt
              continue
            fi

            echo "  Phase A: ${AUTO_TAG_REF} -> anchor ${anchor_ref}"
            crane copy "${anchor_ref}" "${AUTO_TAG_REF}"
            echo "  Phase B: ${AUTO_TAG_REF} -> ${TARGET_REF}"
            crane copy "${TARGET_REF}" "${AUTO_TAG_REF}"
            echo "$AUTO_TAG_REF" >> built-tags/tags.txt
          done

          echo ""
          echo "=== Promotion complete ==="

      - name: Upload promoted tags
        uses: actions/upload-artifact@v4
        with:
          name: promoted-tags
          path: built-tags/
          retention-days: 1

  cleanup-qa-refs:
    # ADR 0019 cond 8. The run-scoped alias tags are forensic evidence of exactly
    # which digest each cell tested, so they are swept AFTER a successful promote,
    # and only strays from OTHER runs are removed — never this run's, which the
    # postmortem would want. Best-effort: a failed sweep must not fail a promotion
    # that already wrote prod.
    needs: [promote]
    if: ${{ always() && !inputs.DRY_RUN && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sweep stray qa-* alias tags from previous runs
        continue-on-error: true
        env:
          NS: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          KEEP: ${{ github.run_id }}
        run: |
          set -uo pipefail
          swept=0
          for tag in $(crane ls "${NS}/base-image" 2>/dev/null | grep -E '^qa-[0-9]+-' || true); do
            run_id="${tag#qa-}"; run_id="${run_id%%-*}"
            [ "$run_id" = "$KEEP" ] && continue
            crane delete "${NS}/base-image:${tag}" 2>/dev/null && swept=$((swept+1))
          done
          echo "swept ${swept} stray qa-* alias tag(s); kept this run's for forensics"

  collect-tags:
    needs: [promote]
    if: always() && !inputs.DRY_RUN
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "promoted-tags"
          path: all-tags/

      - name: Aggregate tags
        id: collect
        run: |
          if [ -d all-tags ] && [ "$(ls -A all-tags 2>/dev/null)" ]; then
            TAGS=$(find all-tags -name '*.txt' -exec cat {} + | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found $(echo "$TAGS" | jq length) unique tags"
          else
            echo "::warning::No tags found"
            TAGS="[]"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

  dry-run:
    needs: generate-configs
    if: ${{ inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Print promotion plan
        env:
          STAGING_DATE: ${{ inputs.STAGING_DATE }}
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          NAMESPACE_PROD: ${{ secrets.DOCKERHUB_NAMESPACE }}
          CONFIGS: ${{ needs.generate-configs.outputs.configs }}
          ALL_CONFIGS: ${{ needs.generate-configs.outputs.all-configs }}
          MINI_TAGS: ${{ needs.generate-configs.outputs.mini-tags }}
        run: |
          echo "=== DRY RUN - Promotion Plan ==="
          echo "Staging date: $STAGING_DATE"
          echo ""

          PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")
          MINI_PYTHON_VERSIONS=("3.10" "3.11" "3.12" "3.13" "3.14")

          # Pre-flight: verify every staging source exists. Dry-run
          # must flag missing images because promote always runs after
          # a dry-run — we want problems visible before the real job
          # begins clobbering prod tags.
          echo "=== Pre-flight: verifying staging sources ==="
          MISSING=()
          CONFIG_COUNT=$(echo "$CONFIGS" | jq length)
          for ((i=0; i<CONFIG_COUNT; i++)); do
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            for py_version in "${PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"
              SOURCE="${NAMESPACE_STAGING}/base-image:${tag_template}-py${py_tag}-${STAGING_DATE}"
              if crane digest "$SOURCE" >/dev/null 2>&1; then
                echo "  ok: $SOURCE"
              else
                echo "  MISSING: $SOURCE"
                MISSING+=("$SOURCE")
              fi
            done
          done
          MINI_COUNT=$(echo "$MINI_TAGS" | jq length)
          for ((i=0; i<MINI_COUNT; i++)); do
            mini_tag=$(echo "$MINI_TAGS" | jq -r ".[$i].mini_tag")
            for py_version in "${MINI_PYTHON_VERSIONS[@]}"; do
              py_tag="${py_version//.}"
              SOURCE="${NAMESPACE_STAGING}/base-image:${mini_tag}-py${py_tag}-${STAGING_DATE}"
              if crane digest "$SOURCE" >/dev/null 2>&1; then
                echo "  ok: $SOURCE"
              else
                echo "  MISSING: $SOURCE"
                MISSING+=("$SOURCE")
              fi
            done
          done
          if [[ "${#MISSING[@]}" -gt 0 ]]; then
            echo ""
            echo "ERROR: ${#MISSING[@]} staging source(s) missing; real promote would abort:"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "Pre-flight passed: all staging sources resolved."
          echo ""

          echo "=== Base Image Promotions (in order) ==="
          CONFIG_COUNT=$(echo "$CONFIGS" | jq length)
          for ((i=0; i<CONFIG_COUNT; i++)); do
            key=$(echo "$CONFIGS" | jq -r ".[$i].key")
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            default_python=$(echo "$CONFIGS" | jq -r ".[$i].default_python")

            echo ""
            echo "--- ${key} ---"
            for py in "${PYTHON_VERSIONS[@]}"; do
              py_tag="${py//.}"
              echo "  ${NAMESPACE_STAGING}/base-image:${tag_template}-py${py_tag}-${STAGING_DATE}"
              echo "    -> ${NAMESPACE_PROD}/base-image:${tag_template}-py${py_tag}-${STAGING_DATE}"
            done
            dp_tag="${default_python//.}"
            echo "  + default python alias:"
            echo "    -> ${NAMESPACE_PROD}/base-image:${tag_template}-${STAGING_DATE} (alias for py${dp_tag})"
          done

          echo ""
          echo "=== Mini Promotions ==="
          MINI_COUNT=$(echo "$MINI_TAGS" | jq length)
          for ((i=0; i<MINI_COUNT; i++)); do
            mini_tag=$(echo "$MINI_TAGS" | jq -r ".[$i].mini_tag")
            for py in "3.10" "3.11" "3.12" "3.13" "3.14"; do
              py_tag="${py//.}"
              echo "  ${NAMESPACE_STAGING}/base-image:${mini_tag}-py${py_tag}-${STAGING_DATE}"
              echo "    -> ${NAMESPACE_PROD}/base-image:${mini_tag}-py${py_tag}-${STAGING_DATE}"
            done
          done

          echo ""
          echo "=== Auto-tag dance resolution ==="
          echo "(Resolves against the live registry so you can verify"
          echo " each auto tag's current digest, its intended final"
          echo " digest, and the anchor that would be used in Phase A.)"
          echo ""

          ALL_COUNT=$(echo "$ALL_CONFIGS" | jq length)

          # Capture current digests of every existing auto tag.
          declare -A AUTO_TARGET_PRE
          for ((i=0; i<ALL_COUNT; i++)); do
            at_template=$(echo "$ALL_CONFIGS" | jq -r ".[$i].tag_template")
            at_cuda_ver=$(echo "$at_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$at_cuda_ver" ]] && continue
            AUTO_TAG_REF="${NAMESPACE_PROD}/base-image:cuda-${at_cuda_ver}-auto"
            if digest=$(crane digest "$AUTO_TAG_REF" 2>/dev/null); then
              AUTO_TARGET_PRE[$at_cuda_ver]="${NAMESPACE_PROD}/base-image@${digest}"
            fi
          done

          # Build the final-target map (promoted configs override pre).
          declare -A AUTO_TARGET_FINAL
          for cuda_ver in "${!AUTO_TARGET_PRE[@]}"; do
            AUTO_TARGET_FINAL[$cuda_ver]="${AUTO_TARGET_PRE[$cuda_ver]}"
          done
          for ((i=0; i<CONFIG_COUNT; i++)); do
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            default_python=$(echo "$CONFIGS" | jq -r ".[$i].default_python")
            cuda_ver=$(echo "$tag_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$cuda_ver" ]] && continue
            dp_tag="${default_python//.}"
            AUTO_TARGET_FINAL[$cuda_ver]="${NAMESPACE_PROD}/base-image:${tag_template}-py${dp_tag}-${STAGING_DATE}"
          done

          # Resolve final target digests. In dry-run the prod-side
          # dated tags don't exist yet, so resolve promoted configs via
          # the staging source that would be copied to prod, and fall
          # back to the pre-captured digest for configs not promoted
          # in this run.
          declare -A FINAL_DIGEST
          for ((i=0; i<CONFIG_COUNT; i++)); do
            tag_template=$(echo "$CONFIGS" | jq -r ".[$i].tag_template")
            default_python=$(echo "$CONFIGS" | jq -r ".[$i].default_python")
            cuda_ver=$(echo "$tag_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$cuda_ver" ]] && continue
            dp_tag="${default_python//.}"
            staging_ref="${NAMESPACE_STAGING}/base-image:${tag_template}-py${dp_tag}-${STAGING_DATE}"
            if d=$(crane digest "$staging_ref" 2>/dev/null); then
              FINAL_DIGEST[$cuda_ver]="$d"
            else
              echo "WARN: could not resolve staging source ${staging_ref}"
            fi
          done
          for cuda_ver in "${!AUTO_TARGET_PRE[@]}"; do
            if [[ -z "${FINAL_DIGEST[$cuda_ver]:-}" ]]; then
              FINAL_DIGEST[$cuda_ver]="${AUTO_TARGET_PRE[$cuda_ver]##*@}"
            fi
          done

          for ((i=0; i<ALL_COUNT; i++)); do
            at_template=$(echo "$ALL_CONFIGS" | jq -r ".[$i].tag_template")
            cuda_ver=$(echo "$at_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
            [[ -z "$cuda_ver" ]] && continue
            TARGET_REF="${AUTO_TARGET_FINAL[$cuda_ver]:-}"
            AUTO_TAG_REF="${NAMESPACE_PROD}/base-image:cuda-${cuda_ver}-auto"

            echo "--- cuda-${cuda_ver}-auto ---"
            if [[ -z "$TARGET_REF" ]]; then
              echo "  (no current auto tag and not in this promotion — skipped)"
              echo ""
              continue
            fi

            current_ref="${AUTO_TARGET_PRE[$cuda_ver]:-}"
            current_digest=""
            [[ -n "$current_ref" ]] && current_digest="${current_ref##*@}"
            target_digest="${FINAL_DIGEST[$cuda_ver]:-}"

            echo "  Current:       ${current_ref:-<none>}"
            echo "  Current digest: ${current_digest:-<none>}"
            echo "  Final target:   ${TARGET_REF}"
            echo "  Final digest:   ${target_digest:-<unresolved>}"

            if [[ -z "$target_digest" ]]; then
              echo "  Phase A/B:     SKIP (final target digest not resolvable)"
              echo ""
              continue
            fi

            anchor_ref=""
            anchor_digest=""
            for ((j=0; j<ALL_COUNT; j++)); do
              [[ "$j" -eq "$i" ]] && continue
              cj_template=$(echo "$ALL_CONFIGS" | jq -r ".[$j].tag_template")
              cj_cuda_ver=$(echo "$cj_template" | sed -n 's/^cuda-\([0-9.]*\)-.*/\1/p')
              [[ -z "$cj_cuda_ver" ]] && continue
              cand_digest="${FINAL_DIGEST[$cj_cuda_ver]:-}"
              [[ -z "$cand_digest" ]] && continue
              if [[ "$cand_digest" != "$current_digest" && "$cand_digest" != "$target_digest" ]]; then
                anchor_ref="${AUTO_TARGET_FINAL[$cj_cuda_ver]}"
                anchor_digest="$cand_digest"
                break
              fi
            done

            if [[ -z "$anchor_ref" ]]; then
              echo "  Phase A/B:     SKIP (no distinct anchor available)"
            else
              echo "  Phase A anchor: ${anchor_ref}"
              echo "  Phase A digest: ${anchor_digest}"
              echo "  Phase A:        ${AUTO_TAG_REF} -> ${anchor_ref}"
              echo "  Phase B:        ${AUTO_TAG_REF} -> ${TARGET_REF}"
            fi
            echo ""
          done

  notify:
    needs: [generate-configs, qa-summary, promote, collect-tags]
    if: always() && !inputs.DRY_RUN
    uses: ./.github/workflows/notify-slack.yml
    with:
      build-result: ${{ needs.promote.result }}
      # ADR 0019 cond 3: a promotion that bypassed the gate, or one that held tags,
      # must be distinguishable in Slack from a clean gated promotion. Without this
      # a run with holds looks identical to a fully-clear one in the only place most
      # people actually read.
      status: ${{ (needs.promote.result != 'success' || needs.qa-summary.result != 'success' || needs.qa-summary.outputs.holds != '0') && 'warning' || '' }}
      # SAY WHAT HAPPENED, NOT WHAT WAS INTENDED — AND REQUIRE SUCCESS TO SAY IT.
      #
      # This is an ALLOWLIST on purpose. The first version enumerated the bad
      # outcomes ('skipped', 'failure') and let everything else fall through to
      # "Base image promoted". A CANCELLED run is neither, so it fell through and
      # announced "Base image promoted — 10 auto tag(s) HELD" for a run in which
      # the promote job never executed and nothing moved. Enumerating the ways a
      # thing can go wrong is how you miss the one nobody listed; requiring the
      # single way it goes RIGHT cannot be missed.
      #
      # So: only `success` may open with "promoted". Every other result — skipped,
      # failure, cancelled, and whatever GitHub adds next — says NOT promoted and
      # names the result, which is also the fastest thing to read at 3am.
      headline: >-
        ${{ needs.promote.result != 'success'
            && format('Base image NOT promoted (promote: {0}) — no tag was changed', needs.promote.result)
            || (needs.qa-summary.result != 'success'
                && 'Base image promoted — QA SUMMARY FAILED, treat every auto tag as unverified')
            || (needs.qa-summary.outputs.holds != '0' && needs.qa-summary.outputs.holds != ''
                && format('Base image promoted — {0} auto tag(s) HELD (QA did not clear them); dated tags landed as normal', needs.qa-summary.outputs.holds))
            || '' }}
      image-name: "Base Image (Production)"
      image-ref: ${{ inputs.STAGING_DATE }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags || '[]' }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
