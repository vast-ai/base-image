# Build Unsloth Studio image - works on main repo (scheduled + manual) and forks (manual)
# Required repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#   DOCKERHUB_NAMESPACE          - production namespace (final multi-arch index lives here)
#   DOCKERHUB_NAMESPACE_STAGING  - staging namespace (per-arch build artifacts live here)
# Optional: SLACK_WEBHOOK_URL
# Note: Build matrix will need periodic updates as new Pytorch images become available
#
# Multi-arch strategy: each (base_image, arch) pair builds natively on the
# matching runner (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) and
# pushes an arch-suffixed tag to the STAGING namespace. A per-base_image
# merge job then uses crane to assemble the multi-arch index at the
# PRODUCTION tag. No QEMU emulation.
#
# Currently amd64-only: `torchao` (transitive via unsloth) lacks arm64
# wheels as of v0.17.0+cu128, so the arm64 matrix entry is intentionally
# absent. See the build job's matrix comment for the re-enable trigger.

name: Build Unsloth Studio Image

on:
  schedule:
    # Run every 12 hours
    - cron: '0 0,12 * * *'

  workflow_dispatch:
    inputs:
      UNSLOTH_VERSION:
        description: "Unsloth PyPI version - leave empty for latest"
        required: false
      DOCKERHUB_REPO:
        description: "Push to username/<repo>"
        required: true
        default: "unsloth-studio"
      LLAMA_CPP_VERSION:
        description: "Unsloth llama.cpp release tag to bake (empty = the pinned default)"
        required: false
      CUSTOM_IMAGE_TAG:
        description: "Custom tag (Auto default)"
        required: false

env:
  DEFAULT_DOCKERHUB_REPO: "unsloth-studio"
  # 12 hours
  RELEASE_AGE_THRESHOLD: 43200

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decision.outputs.should-run }}
      unsloth-version: ${{ steps.release-check.outputs.resolved-version }}
      llama-cpp-version: ${{ steps.llama-check.outputs.resolved-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required secrets
        id: secrets
        run: |
          missing=()
          [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]] && missing+=("DOCKERHUB_USERNAME")
          [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]] && missing+=("DOCKERHUB_TOKEN")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE }}" ]] && missing+=("DOCKERHUB_NAMESPACE")
          [[ -z "${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}" ]] && missing+=("DOCKERHUB_NAMESPACE_STAGING")
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Required secrets configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping - missing secrets: ${missing[*]}"
          fi

      - name: Check PyPI release
        id: release-check
        uses: ./.github/actions/check-pypi-release
        with:
          package: unsloth
          age-threshold-seconds: ${{ env.RELEASE_AGE_THRESHOLD }}
          trigger: ${{ github.event_name }}
          manual-version: ${{ inputs.UNSLOTH_VERSION }}

      # The llama.cpp bundle version is DERIVED from the publisher, not carried as a
      # literal in this file — a pin here would go stale silently and every rebuild
      # would keep shipping whatever bundle was current the day someone last edited it.
      # `manual-ref` lets a dispatch name an exact release when one is wanted.
      #
      # This resolver deliberately does NOT feed `should-run` below: the build TRIGGER is
      # a new unsloth release. A new llama.cpp is not a reason to rebuild this image on
      # its own, and wiring it in would make an upstream cadence we do not control drive
      # our build schedule. It only answers "which bundle should the build that IS
      # happening bake?".
      #
      # tag-pattern is required, not decoration: the fork publishes TWO tag lines in one
      # repo — the `-mix-` builds and an older bare `bNNNN` line — and without it the
      # resolver sorts by updated_at across both and can select from the wrong one.
      - name: Resolve the llama.cpp bundle release
        id: llama-check
        uses: ./.github/actions/check-github-release
        with:
          repository: unslothai/llama.cpp
          age-threshold-seconds: ${{ env.RELEASE_AGE_THRESHOLD }}
          trigger: ${{ github.event_name }}
          manual-ref: ${{ inputs.LLAMA_CPP_VERSION }}
          resolve-master-to-commit: "false"
          tag-pattern: '-mix-'

      - name: Determine if build should run
        id: decision
        run: |
          if [[ "${{ steps.secrets.outputs.available }}" == "true" && "${{ steps.release-check.outputs.new-release }}" == "true" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Building unsloth ${{ steps.release-check.outputs.resolved-version }}"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: ${{ matrix.arch.runs_on }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        base_image:
          - vastai/pytorch:2.10.0-cu128-cuda-12.9-mini-py312-2026-09-01
        # arm64 is intentionally absent: `torchao` (transitive via
        # unsloth-zoo>=2026.5.3 -> unsloth) only publishes amd64 manylinux
        # wheels as of v0.17.0+cu128. Re-add when upstream torchao ships
        # aarch64 wheels (and update merge-manifests `arches` below).
        arch:
          - { platform: linux/amd64, suffix: amd64, runs_on: ubuntu-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Derive staging tag
        run: |
          PYTORCH_BASE="${{ matrix.base_image }}"
          TAG="${PYTORCH_BASE##*:}"

          CUDA_VERSION=$(echo "$TAG" | sed -n 's/.*cuda-\([0-9.]*\).*/\1/p')
          PYTHON_VERSION=$(echo "$TAG" | sed -n 's/.*-py\([0-9]*\).*/py\1/p')

          if [ -z "$CUDA_VERSION" ] || [ -z "$PYTHON_VERSION" ]; then
            echo "Failed to parse base image: $PYTORCH_BASE"
            exit 1
          fi

          IMAGE_TAG_BASE="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [ -z "$IMAGE_TAG_BASE" ]; then
            IMAGE_TAG_BASE="${{ needs.preflight.outputs.unsloth-version }}"
          fi

          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          IMAGE_TAG="${IMAGE_TAG_BASE}-cuda-${CUDA_VERSION}-${PYTHON_VERSION}"
          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV

          echo "Derived staging tag base: $STAGING_TAG_BASE (arch=${{ matrix.arch.suffix }})"

      - name: Build and push arch image to staging
        uses: ./.github/actions/build-arch-image
        with:
          context: derivatives/pytorch/derivatives/unsloth-studio
          arch: ${{ matrix.arch.platform }}
          tag-base: ${{ env.STAGING_TAG_BASE }}
          build-args: |
            PYTORCH_BASE=${{ matrix.base_image }}
            UNSLOTH_VERSION=${{ needs.preflight.outputs.unsloth-version }}
            LLAMA_CPP_VERSION=${{ needs.preflight.outputs.llama-cpp-version }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Live-GPU QA gate (ADR 0005). This image had NO gate: merge-manifests depended only
  # on `build`, so a green `docker build` was the whole bar — which ADR 0001 says is not
  # a correctness check. It is also the image whose CUDA backend silently regressed to
  # CPU once already (ADR 0016), a class of failure no build can see.
  #
  # The staging tag is reassembled here rather than passed between jobs: `build` writes
  # it to $GITHUB_ENV, which does not cross a job boundary, and the pieces (unsloth
  # version, cuda, python) are all preflight outputs or literals in this file.
  #
  # IT DOES NOT GATE YET (ADR 0006's advisory ramp). merge-manifests lists it in `needs`
  # so it is ORDERED ahead of the production approval prompt — a human is never asked to
  # approve before this cell's evidence exists — and `!cancelled()` keeps it from
  # BLOCKING, with the results that must still block named explicitly. Promote it by
  # adding `needs.qa.result == 'success'` to that `if` after two consecutive green runs.
  qa:
    needs: [preflight, build]
    if: needs.preflight.outputs.should-run == 'true'
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'unsloth-studio' }}
      tag: ${{ inputs.CUSTOM_IMAGE_TAG || needs.preflight.outputs.unsloth-version }}-cuda-12.9-py312-amd64
      template_dir: derivatives/pytorch/derivatives/unsloth-studio/templates/unsloth-studio-qa
      label: base-image-qa-unsloth-studio
      log_paths: "/var/log/portal/unsloth-studio.log"
      require_tests: "base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries unsloth.d/10-unsloth-serving unsloth.d/11-llama-offload"
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  merge-manifests:
    # `qa` is in `needs` to ORDER it ahead of the production approval prompt and absent
    # from the `if` so it cannot BLOCK — the advisory ramp. `!cancelled()` is what makes
    # that true and is not decoration: a job named in `needs` blocks BY DEFAULT, because
    # GitHub implicitly skips a job when anything it needs fails. Since that implicit
    # skip is now off for everything, the result that MUST still block is named.
    needs: [preflight, build, qa]
    if: >-
      !cancelled()
      && needs.preflight.outputs.should-run == 'true'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || '' }}
    strategy:
      fail-fast: false
      matrix:
        base_image:
          - vastai/pytorch:2.10.0-cu128-cuda-12.9-mini-py312-2026-09-01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        run: |
          PYTORCH_BASE="${{ matrix.base_image }}"
          TAG="${PYTORCH_BASE##*:}"

          CUDA_VERSION=$(echo "$TAG" | sed -n 's/.*cuda-\([0-9.]*\).*/\1/p')
          PYTHON_VERSION=$(echo "$TAG" | sed -n 's/.*-py\([0-9]*\).*/py\1/p')

          IMAGE_TAG_BASE="${{ inputs.CUSTOM_IMAGE_TAG }}"
          if [ -z "$IMAGE_TAG_BASE" ]; then
            IMAGE_TAG_BASE="${{ needs.preflight.outputs.unsloth-version }}"
          fi

          DOCKERHUB_REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          IMAGE_TAG="${IMAGE_TAG_BASE}-cuda-${CUDA_VERSION}-${PYTHON_VERSION}"

          STAGING_TAG_BASE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"
          PROD_TAG="${{ secrets.DOCKERHUB_NAMESPACE }}/${DOCKERHUB_REPO}:${IMAGE_TAG}"

          echo "STAGING_TAG_BASE=$STAGING_TAG_BASE" >> $GITHUB_ENV
          echo "PROD_TAG=$PROD_TAG" >> $GITHUB_ENV

          MATRIX_ID=$(echo "$PYTORCH_BASE" | md5sum | cut -c1-8)
          echo "MATRIX_ID=$MATRIX_ID" >> $GITHUB_ENV

      - name: Assemble multi-arch index in production
        uses: ./.github/actions/merge-arch-manifests
        with:
          target-tag: ${{ env.PROD_TAG }}
          source-tag-base: ${{ env.STAGING_TAG_BASE }}
          # amd64-only until upstream torchao ships arm64 wheels (see build
          # matrix comment above). Keep the merge step in place so the
          # production tag still resolves through the standard staging->prod
          # path; add `arm64` back to this list when the matrix gains arm64.
          arches: amd64
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record merged manifest tag
        run: |
          mkdir -p built-tags
          echo "${{ env.PROD_TAG }}" > built-tags/tag-${{ env.MATRIX_ID }}.txt

      - name: Upload manifest tag
        uses: actions/upload-artifact@v4
        with:
          name: built-tag-${{ env.MATRIX_ID }}
          path: built-tags/
          retention-days: 1

  collect-tags:
    needs: [preflight, build, merge-manifests]
    if: always() && needs.preflight.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download all tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: built-tag-*
          path: all-tags/
          merge-multiple: true

      - name: Aggregate tags
        id: collect
        run: |
          if [ -d all-tags ] && [ "$(ls -A all-tags 2>/dev/null)" ]; then
            # Combine all tag files into JSON array
            TAGS=$(cat all-tags/*.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found tags: $TAGS"
          else
            echo "::warning::No tags found - build may have failed"
            TAGS="[]"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  notify:
    needs: [preflight, build, merge-manifests, collect-tags]
    if: always() && needs.preflight.outputs.should-run == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      build-result: ${{ needs.merge-manifests.result }}
      image-name: "Unsloth Studio"
      image-ref: ${{ needs.preflight.outputs.unsloth-version }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
