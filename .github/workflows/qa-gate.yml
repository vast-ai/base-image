# Reusable live-GPU QA gate (ADR 0005). Image-agnostic: a build workflow
# calls this once per staging artifact, passing the finished image coordinates +
# the QA template. All per-image variation (tag derivation, matrix shape, the
# provisioning/model env) stays in the CALLER; this job is just the shared core —
# create a throwaway template -> launch + run the in-instance harness, DESTROYING
# the instance -> delete the template -> map a machine-readable verdict.
#
# Caller pattern:
#   qa:
#     needs: [preflight, build]
#     strategy: { matrix: { include: [ {cuda: "12.9", py: "py312"}, ... ] } }
#     uses: ./.github/workflows/qa-gate.yml
#     with: { repo: comfy, tag: "...-cuda-${{matrix.cuda}}-...-amd64", template_dir: ..., label: base-image-qa-<img>, ... }
#     secrets: { VAST_API_KEY: ..., DOCKERHUB_NAMESPACE_STAGING: ..., SLACK_WEBHOOK_URL: ... }
#   merge-manifests: { needs: [preflight, build, qa] }   # gated on qa
name: QA gate (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: "Dockerhub repo; the tested image is <staging-namespace>/<repo>"
        required: true
        type: string
      tag:
        description: "The amd64 staging tag to test (already derived by the caller)"
        required: true
        type: string
      template_dir:
        description: "Path to the QA template dir (<name>/template.yml)"
        required: true
        type: string
      label:
        description: "Vast instance label to stamp (reaper scope; prefix base-image-qa)"
        required: true
        type: string
      log_paths:
        description: "Space-separated in-instance log files to stream into the run"
        required: false
        type: string
        default: ""
      extra_env:
        description: "Newline-separated KEY=VAL passed as test_template --env (e.g. a SHA-pinned provisioning URL)"
        required: false
        type: string
        default: ""
      max_price:
        description: "Per-run $/hr cost cap (dph_total). Backstops the VRAM band, which bounds box size but not price."
        required: false
        type: string
        default: "2.00"
      timeout:
        required: false
        type: string
        default: "7800"
      require_floor:
        description: "Fail if the template declares no parseable compute_cap floor"
        required: false
        type: boolean
        default: true
      # --- ADR 0019 additions. Every default reproduces today's behaviour exactly,
      # so the existing comfyui/vllm callers are unaffected without touching them.
      require_key:
        description: >-
          Fail (not skip) when VAST_API_KEY is absent. The default advisory-skip is a
          deliberate rollout ramp, but for a consumer that calls itself a gate a missing
          key silently turns gating back into no gating, with a green check.
        required: false
        type: boolean
        default: false
      require_tests:
        description: >-
          Space/comma-separated test names that must be PRESENT and PASSED in the
          verdict payload. A skip is not a pass: the GPU trio skips itself when the
          driver or CUDA userland is unavailable, and the suite then reports green.
          This is the CI-side half of the runner's INSTANCE_TEST_REQUIRE_PASS gate —
          it still fires if the template loses that env var.
        required: false
        type: string
        default: ""
      retries:
        description: >-
          Extra attempts on an INFRA-inconclusive outcome only (no_offers). Never on a
          real failure, an instance crash or a config error — retrying a red is how a
          gate becomes decoration. bad_instance is excluded too: it already exhausted
          the client's own launch attempts.
        required: false
        type: number
        default: 0
      poll_timeout:
        description: >-
          Seconds to wait for an instance to reach "running" (boot + image pull)
          before abandoning that offer and trying the next. Empty keeps the
          client's default of 2400 (40 min), which suits a derivative pulling a
          large model. An image whose whole test takes minutes should set this far
          lower: a generous cap means one pathologically slow host burns the full
          window before the client moves on, and it can do that once per launch
          attempt.
        required: false
        type: string
        default: ""
      retry_delay:
        description: "Seconds to wait between retries. A thin offer market does not change in 90s."
        required: false
        type: number
        default: 300
      evidence_name:
        description: >-
          Artifact name for this cell's verdict payload. Must be unique per matrix cell —
          upload-artifact@v4 rejects duplicate names within a run. Empty = no upload.
        required: false
        type: string
        default: ""
      set_filters:
        description: >-
          Space-separated KEY.OP=VALUE floor overrides applied at template-create time
          (e.g. "cuda_max_good.gte=13.0"). RAISE-ONLY — create.py rejects an override that
          would widen selection, so the linted floors keep describing what gets rented.
          Used by the base gate, whose 12 configs each need their own driver floor.
        required: false
        type: string
        default: ""
    secrets:
      VAST_API_KEY:
        required: false
      DOCKERHUB_NAMESPACE_STAGING:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
    outputs:
      gated:
        description: "true if the live QA test actually ran (VAST_API_KEY present); false = advisory-skipped. Identical across matrix cells (repo-secret driven), so relaying it via needs.qa.outputs is matrix-safe — unlike a per-cell verdict."
        value: ${{ jobs.qa.outputs.gated }}

jobs:
  qa:
    runs-on: ubuntu-latest
    # Hard backstop below the 6h GitHub cap. test_template.py's own timeouts sum
    # to ~3h worst case (poll 40m + test ~130m + launch/setup), so it should
    # self-terminate and destroy its instance well before this fires; 240m only
    # catches a true hang, killing it at 4h (not 6h) to limit wasted minutes and
    # the orphan window (the reaper still backstops). See ADR 0005 runtime budget.
    timeout-minutes: 240
    # soft_pass is set only when an unattended scheduled run promoted UNGATED
    # (inconclusive infra outcome). notify-soft-pass below pings Slack so that
    # silent no-op surfaces instead of decaying quietly.
    outputs:
      soft_pass: ${{ steps.verdict.outputs.soft_pass }}
      gated: ${{ steps.guard.outputs.run }}   # did the live test actually run (secret present)
    # NOTE: no account-wide concurrency group. A single `qa-vast-account` group
    # (cancel-in-progress: false) only ever allows 1 running + 1 pending and
    # CANCELS the rest — so >2 contending QA cells (two images at once, or one
    # image with 3+ CUDA cells) cancel each other, and a cancelled qa job blocks
    # `merge-manifests` (needs: [qa]). Concurrent QA DOES 429 the shared single-key
    # account (observed live), so the fix is client-side, not serialization:
    # `test_template.py` retries/backs off (with jitter) on 429/5xx, and the
    # schedule soft-pass pings Slack. Bounded concurrency for the many-image rollout
    # is a planned follow-up (an account-aware semaphore; ADR 0005 cond 6). Until
    # then: run QA concurrently, relying on the client's rate-limit backoff.
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      TM: tools/template_manager
      # Empty leaves the client's own default in place — _env_int treats unset and
      # empty identically — so every existing consumer is untouched.
      QA_POLL_TIMEOUT: ${{ inputs.poll_timeout }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate readiness (advisory until the QA account secret exists)
        id: guard
        run: |
          if [ -z "${VAST_API_KEY}" ]; then
            if [ "${{ inputs.require_key }}" = "true" ]; then
              # A caller that gates promotion on this cannot treat a missing key as
              # "skip, carry on" — that converts gating into no gating while still
              # reporting green. Fail closed instead (ADR 0019 cond 3).
              echo "::error::VAST_API_KEY not set and require_key=true — refusing to report a pass for a test that did not run."
              exit 1
            fi
            echo "::warning::VAST_API_KEY not set — skipping live QA (advisory; promotion not blocked)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install template_manager deps
        if: steps.guard.outputs.run == 'true'
        run: pip install -r "${TM}/requirements.txt"

      - name: Create throwaway QA template
        if: steps.guard.outputs.run == 'true'
        id: create
        env:
          STAGING_NS: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          SET_FILTERS: ${{ inputs.set_filters }}
        run: |
          IMAGE="${STAGING_NS}/${{ inputs.repo }}"
          echo "Testing ${IMAGE}:${{ inputs.tag }}"
          SF=()
          for f in ${SET_FILTERS}; do SF+=(--set-filter "$f"); done
          python "${TM}/create.py" "${{ github.workspace }}/${{ inputs.template_dir }}" \
            --image "${IMAGE}" --tag "${{ inputs.tag }}" \
            "${SF[@]}" \
            --emit-result /tmp/qa-create.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("/tmp/qa-create.json"))
          assert r and r[0].get("hash_id") and r[0].get("id"), f"create returned no hash/id: {r}"
          print(f"hash={r[0]['hash_id']}")
          print(f"id={r[0]['id']}")
          PY

      - name: Run live test (DESTROY the instance after)
        if: steps.guard.outputs.run == 'true'
        id: test
        continue-on-error: true
        env:
          LOG_PATHS: ${{ inputs.log_paths }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          ARGS=()
          for p in ${LOG_PATHS}; do ARGS+=(--log "$p"); done
          while IFS= read -r kv; do [ -n "$kv" ] && ARGS+=(--env "$kv"); done <<< "${EXTRA_ENV}"
          if [ "${{ inputs.require_floor }}" = "true" ]; then ARGS+=(--require-floor); fi

          # Retry only an INFRA-inconclusive outcome (2 = no_offers: nothing in the
          # market matched the floors, so the image was never tested). Never retry a
          # real failure (1), an instance crash (5) or a config error (4) — retrying a
          # red is how a gate turns into decoration. 3 (bad_instance) is excluded
          # because the client already exhausted its own launch attempts internally.
          ATTEMPTS=$(( ${{ inputs.retries }} + 1 ))
          for attempt in $(seq 1 "$ATTEMPTS"); do
            [ "$attempt" -gt 1 ] && echo "::notice::attempt ${attempt}/${ATTEMPTS} after an inconclusive market result"
            set +e
            python "${TM}/test_template.py" "${{ steps.create.outputs.hash }}" \
              --destroy --raw --force --label "${{ inputs.label }}" \
              --max-price "${{ inputs.max_price }}" --timeout "${{ inputs.timeout }}" \
              "${ARGS[@]}" \
              > /tmp/qa-raw.json
            CODE=$?
            set -e
            echo "---- attempt ${attempt} verdict ----"; cat /tmp/qa-raw.json || echo "(no --raw output)"
            [ "$CODE" -ne 2 ] && break
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              # Jitter: a matrix of cells that all went inconclusive did so because
              # the market was thin for all of them at once, so an unjittered delay
              # marches them back to the single-key account in lockstep (ADR 0005
              # cond 6). Spread is up to +50%.
              _delay=$(( ${{ inputs.retry_delay }} + RANDOM % ((${{ inputs.retry_delay }} / 2) + 1) ))
              echo "no offers matched the floors; waiting ${_delay}s before retrying"
              sleep "$_delay"
            fi
          done
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "attempts=${attempt}" >> "$GITHUB_OUTPUT"

      - name: Delete the throwaway template (always)
        if: always() && steps.create.outputs.id != ''
        run: |
          python "${TM}/create.py" --delete "${{ steps.create.outputs.id }}" \
            || echo "::warning::template ${{ steps.create.outputs.id }} delete failed (HTTP error) — harmless private-template clutter; the instance was already destroyed"

      - name: Verdict
        id: verdict
        if: steps.guard.outputs.run == 'true'
        run: |
          CODE="${{ steps.test.outputs.exit_code }}"
          # The decision (pass / block / inconclusive) lives in qa_verdict.py — pure,
          # unit-tested, and the place the required-tests assertion is enforced. It
          # also owns the "take the last complete {...} line" parsing: a whole-file
          # parse once silently turned a real PASS into a BLOCK on the cu12.9 cell.
          # This step keeps only the POLICY: what to do with an inconclusive.
          # NEVER eval this tool's stdout. A reason legitimately contains spaces,
          # ';' and '()' ("3 required test(s) passed"), so under bash -e an eval is a
          # syntax error that fails the step on a PASSING cell — and this workflow is
          # shared with the live comfyui/vllm gates. The tool appends verdict=/reason=
          # to $GITHUB_OUTPUT itself; we read the key back.
          python "${TM}/qa_verdict.py" \
            --exit-code "${CODE}" \
            --raw /tmp/qa-raw.json \
            --require-tests "${{ inputs.require_tests }}"
          verdict=$(sed -n 's/^verdict=//p' "$GITHUB_OUTPUT" | tail -n1)
          echo "exit_code=${CODE} verdict=${verdict}"

          case "${verdict}" in
            pass)
              echo "::notice::FULL pass (see the verdict line above)"
              exit 0 ;;
            block)
              echo "::error::BLOCK (see the verdict line above)"
              exit 1 ;;
            inconclusive)
              # ADR 0005: a gating path HOLDS so a human looks; only the unattended
              # schedule soft-passes, so a thin 00:00 market cannot block the nightly
              # promotion of an unchanged image.
              echo "::warning::INCONCLUSIVE (see the verdict line above)"
              if [ "${{ github.event_name }}" = "schedule" ]; then
                # Set BEFORE the exit so the output is written; notify-soft-pass pings
                # Slack, because a gate that chronically cannot run must surface rather
                # than decay into a no-op.
                echo "soft_pass=true" >> "$GITHUB_OUTPUT"
                echo "::warning::scheduled run promoted UNGATED (no live QA ran) — Slack alerted"
                exit 0
              fi
              exit 1 ;;
            *)
              echo "::error::qa_verdict returned no usable verdict (${verdict:-<empty>})"
              exit 1 ;;
          esac

      # Per-cell evidence for the approval summary: the verdict payload names the
      # GPU, driver, digest and per-test states the decision was actually made on.
      # `always()` so a BLOCKed cell — the one a human most needs to read — still
      # uploads. The name must be unique per matrix cell; upload-artifact@v4 rejects
      # duplicates within a run.
      - name: Upload verdict evidence
        if: always() && inputs.evidence_name != '' && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.evidence_name }}
          path: /tmp/qa-raw.json
          retention-days: 7
          if-no-files-found: ignore

  # When an unattended scheduled run soft-passed (promoted UNGATED on an infra-
  # inconclusive outcome), ping Slack. Real test failures BLOCK the qa job, so
  # this never runs for those — it exists solely so a silently-skipped gate on the
  # release train surfaces instead of decaying to a no-op (review follow-up).
  notify-soft-pass:
    needs: qa
    if: needs.qa.outputs.soft_pass == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      build-result: "success"   # it DID promote (ungated) — a warning, not a build failure
      status: "warning"         # ⚠️ yellow, and render the promoted tag
      headline: "${{ inputs.repo }} promoted UNGATED — scheduled QA inconclusive (thin market / infra); no live test ran"
      image-name: ${{ inputs.repo }}
      image-ref: ${{ inputs.tag }}
      image-tags: ${{ format('["{0}"]', inputs.tag) }}
      trigger: "schedule — QA inconclusive"
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
