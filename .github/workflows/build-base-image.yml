# Build base images across all config variants and Python versions
# Splits arch builds into separate jobs, then merges into multi-arch manifests
# Required repository secrets:
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN
# DOCKERHUB_NAMESPACE_STAGING
# Optional:
# SLACK_WEBHOOK_URL

name: Build Base Image

on:
  workflow_dispatch:
    inputs:
      FILTER:
        description: "Filter configs by pattern (e.g. cuda-12, stock, 24)"
        required: false
        default: ""
      DRY_RUN:
        description: "Print what would build without building"
        required: false
        default: false
        type: boolean

concurrency:
  group: base-image-build
  cancel-in-progress: false

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          [[ -z "$NAMESPACE" ]] && missing+=("DOCKERHUB_NAMESPACE_STAGING")
          [[ -z "$USERNAME" ]] && missing+=("DOCKERHUB_USERNAME")
          [[ -z "$TOKEN" ]] && missing+=("DOCKERHUB_TOKEN")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are set"

  generate-matrix:
    needs: validate-secrets
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrix.outputs.build-matrix }}
      merge-matrix: ${{ steps.matrix.outputs.merge-matrix }}
      mini-build-matrix: ${{ steps.matrix.outputs.mini-build-matrix }}
      mini-merge-matrix: ${{ steps.matrix.outputs.mini-merge-matrix }}
      build-date: ${{ steps.matrix.outputs.build-date }}
    steps:
      # Needed for configs/base-image.json — this job previously ran with no checkout.
      - uses: actions/checkout@v4

      - name: Generate matrices
        id: matrix
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "build-date=$BUILD_DATE" >> $GITHUB_OUTPUT

          FILTER="${{ inputs.FILTER }}"

          # Build configs: key|base_image|tag_template|arches|default_python
          # Config table lives in configs/base-image.json (ADR 0019) — it was inline in three workflows, so a patch bump had to land three times and a miss was silent. jq preserves array order, which the auto-tag dance depends on.
          mapfile -t CONFIGS < <(jq -r '.configs[] | "\(.key)|\(.base_image)|\(.tag_template)|\(.arches|join(","))|\(.default_python)"' "$GITHUB_WORKSPACE/configs/base-image.json")

          BUILD_MATRIX="[]"
          MERGE_MATRIX="[]"

          for config in "${CONFIGS[@]}"; do
            IFS='|' read -r key base_image tag_template arches default_python <<< "$config"

            # Apply filter
            if [[ -n "$FILTER" && "$key" != *"$FILTER"* ]]; then
              continue
            fi

            # Add to merge matrix (one per config)
            MERGE_MATRIX=$(echo "$MERGE_MATRIX" | jq -c \
              --arg key "$key" \
              --arg tag_template "$tag_template" \
              --arg default_python "$default_python" \
              '. + [{"config_key": $key, "tag_template": $tag_template, "default_python": $default_python}]')

            # Split arches into separate build matrix entries
            IFS=',' read -ra ARCH_LIST <<< "$arches"
            for arch in "${ARCH_LIST[@]}"; do
              arch_suffix="${arch#linux/}"
              # Native runner per arch — no QEMU. arm64 builds on arm hardware.
              if [[ "$arch" == "linux/arm64" ]]; then
                runs_on="ubuntu-24.04-arm"
              else
                runs_on="ubuntu-latest"
              fi
              BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c \
                --arg key "$key" \
                --arg base_image "$base_image" \
                --arg tag_template "$tag_template" \
                --arg arch "$arch" \
                --arg arch_suffix "$arch_suffix" \
                --arg runs_on "$runs_on" \
                --arg default_python "$default_python" \
                '. + [{"config_key": $key, "base_image": $base_image, "tag_template": $tag_template, "arch": $arch, "arch_suffix": $arch_suffix, "runs_on": $runs_on, "default_python": $default_python}]')
            done
          done
          # Mini configs from the same table.
          mapfile -t MINI_CONFIGS < <(jq -r '.mini[] | "\(.key)|\(.mini_tag)|\(.cuda_versions)"' "$GITHUB_WORKSPACE/configs/base-image.json")

          MINI_BUILD_MATRIX="[]"
          MINI_MERGE_MATRIX="[]"

          for mini_config in "${MINI_CONFIGS[@]}"; do
            IFS='|' read -r key mini_tag cuda_versions <<< "$mini_config"

            if [[ -n "$FILTER" && "$key" != *"$FILTER"* && "mini" != *"$FILTER"* ]]; then
              continue
            fi

            MINI_MERGE_MATRIX=$(echo "$MINI_MERGE_MATRIX" | jq -c \
              --arg key "$key" \
              --arg mini_tag "$mini_tag" \
              '. + [{"config_key": $key, "mini_tag": $mini_tag}]')

            for arch in "linux/amd64" "linux/arm64"; do
              arch_suffix="${arch#linux/}"
              # Native runner per arch — no QEMU. arm64 builds on arm hardware.
              if [[ "$arch" == "linux/arm64" ]]; then
                runs_on="ubuntu-24.04-arm"
              else
                runs_on="ubuntu-latest"
              fi
              MINI_BUILD_MATRIX=$(echo "$MINI_BUILD_MATRIX" | jq -c \
                --arg key "$key" \
                --arg mini_tag "$mini_tag" \
                --arg cuda_versions "$cuda_versions" \
                --arg arch "$arch" \
                --arg arch_suffix "$arch_suffix" \
                --arg runs_on "$runs_on" \
                '. + [{"config_key": $key, "mini_tag": $mini_tag, "cuda_versions": $cuda_versions, "arch": $arch, "arch_suffix": $arch_suffix, "runs_on": $runs_on}]')
            done
          done

          # Output matrices
          {
            echo "build-matrix<<BUILD_MATRIX_EOF"
            echo "{\"include\":${BUILD_MATRIX}}"
            echo "BUILD_MATRIX_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "merge-matrix<<MERGE_MATRIX_EOF"
            echo "{\"include\":${MERGE_MATRIX}}"
            echo "MERGE_MATRIX_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "mini-build-matrix<<MINI_BUILD_MATRIX_EOF"
            echo "{\"include\":${MINI_BUILD_MATRIX}}"
            echo "MINI_BUILD_MATRIX_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "mini-merge-matrix<<MINI_MERGE_MATRIX_EOF"
            echo "{\"include\":${MINI_MERGE_MATRIX}}"
            echo "MINI_MERGE_MATRIX_EOF"
          } >> $GITHUB_OUTPUT

          echo "Build matrix entries: $(echo $BUILD_MATRIX | jq length)"
          echo "Merge matrix entries: $(echo $MERGE_MATRIX | jq length)"
          echo "Mini build matrix entries: $(echo $MINI_BUILD_MATRIX | jq length)"
          echo "Build date: $BUILD_DATE"

  build:
    needs: generate-matrix
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.generate-matrix.outputs.build-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build all Python versions
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          TAG_TEMPLATE: ${{ matrix.tag_template }}
          BASE_IMAGE: ${{ matrix.base_image }}
          ARCH: ${{ matrix.arch }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          DEFAULT_PYTHON: ${{ matrix.default_python }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
        run: |
          # Python matrix from configs/base-image.json (ADR 0019) — it was hardcoded
          # identically in five places here, so the shared table could claim one set
          # of versions while the build shipped another.
          mapfile -t PYTHON_VERSIONS < <(jq -r '.python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          mkdir -p built-tags

          for py_version in "${PYTHON_VERSIONS[@]}"; do
            py_tag="${py_version//.}"

            # Primary arch-specific tag with date
            PRIMARY_TAG="${NAMESPACE}/base-image:${TAG_TEMPLATE}-py${py_tag}-${BUILD_DATE}-${ARCH_SUFFIX}"

            TAGS="--tag ${PRIMARY_TAG}"

            # Default Python alias (no -pyXXX)
            if [[ "$py_version" == "$DEFAULT_PYTHON" ]]; then
              ALIAS_TAG="${NAMESPACE}/base-image:${TAG_TEMPLATE}-${BUILD_DATE}-${ARCH_SUFFIX}"
              TAGS+=" --tag ${ALIAS_TAG}"
              echo "$ALIAS_TAG" >> built-tags/tags.txt
            fi

            echo "=== Building ${TAG_TEMPLATE} py${py_tag} for ${ARCH} ==="
            docker buildx build \
              --progress=plain \
              --platform "${ARCH}" \
              -f Dockerfile \
              --build-arg BASE_IMAGE="${BASE_IMAGE}" \
              --build-arg PYTHON_VERSION="${py_version}" \
              ${TAGS} \
              --push .

            echo "$PRIMARY_TAG" >> built-tags/tags.txt
            echo "Pushed: ${PRIMARY_TAG}"
          done

      - name: Upload built tags
        uses: actions/upload-artifact@v4
        with:
          name: built-tags-${{ matrix.config_key }}-${{ matrix.arch_suffix }}
          path: built-tags/
          retention-days: 1

  merge-manifests:
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.merge-matrix) }}
    steps:
      # Needed for configs/base-image.json — this job previously ran with no checkout.
      - uses: actions/checkout@v4
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge arch manifests
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          TAG_TEMPLATE: ${{ matrix.tag_template }}
          DEFAULT_PYTHON: ${{ matrix.default_python }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
        run: |
          # Python matrix from configs/base-image.json (ADR 0019) — it was hardcoded
          # identically in five places here, so the shared table could claim one set
          # of versions while the build shipped another.
          mapfile -t PYTHON_VERSIONS < <(jq -r '.python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          mkdir -p built-tags

          for py_version in "${PYTHON_VERSIONS[@]}"; do
            py_tag="${py_version//.}"

            FINAL_TAG="${NAMESPACE}/base-image:${TAG_TEMPLATE}-py${py_tag}-${BUILD_DATE}"
            AMD64_TAG="${FINAL_TAG}-amd64"
            ARM64_TAG="${FINAL_TAG}-arm64"

            echo "=== Merging manifest: ${FINAL_TAG} ==="
            # --docker-empty-base forces a fresh scratch index so re-runs are
            # idempotent (no duplicate platform entries accumulating on the tag).
            crane index append \
              --docker-empty-base \
              --tag "${FINAL_TAG}" \
              --manifest "${AMD64_TAG}" \
              --manifest "${ARM64_TAG}"

            echo "$FINAL_TAG" >> built-tags/tags.txt

            if [[ "$py_version" == "$DEFAULT_PYTHON" ]]; then
              ALIAS_TAG="${NAMESPACE}/base-image:${TAG_TEMPLATE}-${BUILD_DATE}"
              echo "=== Aliasing ${FINAL_TAG} -> ${ALIAS_TAG} ==="
              # crane copy cross-mounts blobs registry-side (no host streaming).
              crane copy "${FINAL_TAG}" "${ALIAS_TAG}"
              echo "$ALIAS_TAG" >> built-tags/tags.txt
            fi
          done

      - name: Upload manifest tags
        uses: actions/upload-artifact@v4
        with:
          name: manifest-tags-${{ matrix.config_key }}
          path: built-tags/
          retention-days: 1

  build-mini:
    needs: [generate-matrix, merge-manifests]
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.mini-build-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build mini Python versions
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          MINI_TAG: ${{ matrix.mini_tag }}
          CUDA_VERSIONS: ${{ matrix.cuda_versions }}
          ARCH: ${{ matrix.arch }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
        run: |
          # Python matrix from configs/base-image.json (ADR 0019) — it was hardcoded
          # identically in five places here, so the shared table could claim one set
          # of versions while the build shipped another.
          mapfile -t MINI_PYTHON_VERSIONS < <(jq -r '.mini_python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          mkdir -p built-tags

          for py_version in "${MINI_PYTHON_VERSIONS[@]}"; do
            py_tag="${py_version//.}"

            # Use the just-built staging stock-24 image as base
            BASE="${NAMESPACE}/base-image:stock-ubuntu24.04-py${py_tag}-${BUILD_DATE}"
            TAG="${NAMESPACE}/base-image:${MINI_TAG}-py${py_tag}-${BUILD_DATE}-${ARCH_SUFFIX}"

            echo "=== Building mini: ${MINI_TAG} py${py_tag} for ${ARCH} ==="
            docker buildx build \
              --progress=plain \
              --platform "${ARCH}" \
              -f Dockerfile.runtime \
              --build-arg BASE_IMAGE="${BASE}" \
              --build-arg CUDA_VERSIONS="${CUDA_VERSIONS}" \
              --tag "${TAG}" \
              --push .

            echo "$TAG" >> built-tags/tags.txt
          done

      - name: Upload mini tags
        uses: actions/upload-artifact@v4
        with:
          name: mini-tags-${{ matrix.config_key }}-${{ matrix.arch_suffix }}
          path: built-tags/
          retention-days: 1

  merge-mini-manifests:
    needs: [generate-matrix, build-mini]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.mini-merge-matrix) }}
    steps:
      # Needed for configs/base-image.json — this job previously ran with no checkout.
      - uses: actions/checkout@v4
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge mini manifests
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          MINI_TAG: ${{ matrix.mini_tag }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
        run: |
          # Python matrix from configs/base-image.json (ADR 0019) — it was hardcoded
          # identically in five places here, so the shared table could claim one set
          # of versions while the build shipped another.
          mapfile -t MINI_PYTHON_VERSIONS < <(jq -r '.mini_python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          mkdir -p built-tags

          for py_version in "${MINI_PYTHON_VERSIONS[@]}"; do
            py_tag="${py_version//.}"

            FINAL_TAG="${NAMESPACE}/base-image:${MINI_TAG}-py${py_tag}-${BUILD_DATE}"
            AMD64_TAG="${FINAL_TAG}-amd64"
            ARM64_TAG="${FINAL_TAG}-arm64"

            echo "=== Merging mini manifest: ${FINAL_TAG} ==="
            crane index append \
              --docker-empty-base \
              --tag "${FINAL_TAG}" \
              --manifest "${AMD64_TAG}" \
              --manifest "${ARM64_TAG}"

            echo "$FINAL_TAG" >> built-tags/tags.txt
          done

      - name: Upload mini manifest tags
        uses: actions/upload-artifact@v4
        with:
          name: mini-manifest-tags-${{ matrix.config_key }}
          path: built-tags/
          retention-days: 1

  # ── cloudflared contract ────────────────────────────────────────────
  #
  # The Dockerfile fetches cloudflared from releases/latest, deliberately
  # unpinned. What replaces the pin is this: whatever binary just shipped must
  # still answer the way tunnel_manager drives it — both argv shapes, the
  # --no-autoupdate flag actually APPLIED (not merely accepted), and the
  # quick-tunnel announcement the portal parses with QUICK_TUNNEL_URL_RE.
  #
  # ONE CELL PER ARCHITECTURE, and no more. `Dockerfile` fetches
  # cloudflared-linux-${TARGETARCH}, so amd64 and arm64 are DIFFERENT binaries
  # from different release artifacts — testing one says nothing about the other,
  # and a release where the arm64 artifact lags or differs would ship unguarded.
  # But the fan-out stops at the architecture: Cloudflare rate-limits
  # quick-tunnel creation (tunnel_manager spaces its own startup tunnels 2s apart
  # for the same reason), so a cell per config x python would rate-limit itself
  # and then report the rate limit as a defect.
  #
  # COUNT IT HONESTLY: this comment used to say "two tunnels per build", which
  # was the number of cells, not the number of tunnels. The suite creates one in
  # the live announcement test and one in the --no-autoupdate-honoured test (the
  # Settings map is printed on a real tunnel start), so it is ~3 creations per
  # cell and ~6 per build. Still the same order as one instance's own startup,
  # but the margin under Cloudflare's per-IP limit is smaller than "two" implied
  # — which is why the per-PR suite deselects the live tests entirely.
  #
  # The binary is EXTRACTED FROM THE BUILT IMAGE, not re-downloaded:
  # releases/latest can move between the build and this job, and testing a
  # different binary from the one that shipped would be worse than not testing.
  cloudflared-contract:
    needs: [generate-matrix, merge-manifests]
    if: ${{ !inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Architecture ONLY. Guarded by test_promote_notification_truth.py so this
      # cannot quietly grow a config/python dimension.
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the portal's own imports
        run: |
          python -m pip install --upgrade pip
          # tunnel_manager's imports, so the test asks the SHIPPED module what
          # argv it builds instead of restating it.
          pip install pytest requests fastapi aiohttp cachetools PyYAML pydantic
      # binfmt, so the arm64 ELF runs on this amd64 runner transparently. The
      # test executes cloudflared directly, so registering the handler is all
      # that is needed — no container gymnastics.
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      # The staging namespace is private; every other job that touches it logs in
      # first. Without this the extract fails on a pull, which would look like a
      # contract failure and is not one.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract the ${{ matrix.arch }} cloudflared from the image just built
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
          MERGE_MATRIX: ${{ needs.generate-matrix.outputs.merge-matrix }}
        run: |
          set -euo pipefail
          # Read the config from the MERGE MATRIX, not configs[0]: the matrix is
          # what this run actually built, so a FILTERed dispatch (FILTER=cuda-12)
          # cannot send us looking for a tag that was never pushed — which would
          # go red for something that is not a contract break.
          TPL=$(jq -r '.include[0].tag_template' <<<"$MERGE_MATRIX")
          PY=$(jq -r '.include[0].default_python' <<<"$MERGE_MATRIX" | tr -d .)
          REF="${NAMESPACE}/base-image:${TPL}-py${PY}-${BUILD_DATE}"
          echo "extracting linux/${{ matrix.arch }} cloudflared from ${REF}"
          docker create --platform linux/${{ matrix.arch }} --name cfx "$REF"
          docker cp cfx:/opt/portal-aio/tunnel_manager/cloudflared ./cloudflared
          docker rm cfx
          chmod +x ./cloudflared
          # ASSERT the architecture, don't just print it. `file ... || true`
          # checked nothing, so if --platform ever resolved to the amd64 image
          # the arm64 cell would silently re-test amd64 and report a green tick
          # — the exact hole this cell exists to close.
          case "${{ matrix.arch }}" in
            amd64) WANT="x86-64" ;;
            arm64) WANT="aarch64" ;;
            *) echo "unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          file ./cloudflared
          file ./cloudflared | grep -q "$WANT" || {
            echo "::error::extracted binary is not $WANT — this cell would have tested the wrong architecture"
            exit 1
          }
          echo "CLOUDFLARED_BIN=$PWD/cloudflared" >> "$GITHUB_ENV"
          ./cloudflared --version
      - name: Contract test (${{ matrix.arch }})
        id: contract
        working-directory: portal-aio
        # A usage rejection, an unapplied --no-autoupdate, or a tunnel that
        # announces nothing parseable fails this job. Being rate-limited by
        # Cloudflare, or not reaching it at all, does NOT — see the test's own
        # BLOCK vs INCONCLUSIVE note. -rs so skips are visible, not silent.
        #
        # `|| true` looks wrong and is not: pytest's exit code cannot express
        # the difference between "verified" and "we never got to ask", and
        # reading it as pass/fail is exactly how this gate reported green under
        # a rate limit while proving nothing. The junit report carries which
        # live assertions actually EXECUTED, so the classifier decides, and it
        # is the classifier's exit code that fails this step.
        run: |
          set -o pipefail
          python -m pytest -q -rs --junitxml=contract.xml \
              tests/test_cloudflared_contract.py || true
          python tests/classify_contract_run.py contract.xml | tee contract-state.txt
      - name: Record the outcome for the notification
        if: always()
        run: |
          mkdir -p cf-state
          # The classifier may not have run at all (an earlier step died), in
          # which case the state is unknown — which must not inherit the benign
          # value. Absent evidence is 'broken' here, deliberately.
          STATE=$(sed -n 's/^state=//p' portal-aio/contract-state.txt 2>/dev/null | tail -1)
          echo "${STATE:-broken}" > "cf-state/${{ matrix.arch }}.txt"
          echo "${{ matrix.arch }}: ${STATE:-broken}"
      - name: Upload the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-state-${{ matrix.arch }}
          path: cf-state/

  # Matrix jobs cannot hand a single value to a downstream job — each cell
  # overwrites `outputs`, last writer wins — so the per-arch states are
  # aggregated here into ONE value the notification can render. Severity order:
  # broken > unverified > verified. One arch proving nothing is not a pass.
  cloudflared-contract-status:
    needs: [cloudflared-contract]
    if: always() && !inputs.DRY_RUN
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.agg.outputs.state }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cf-state-*
          path: cf-state/
        continue-on-error: true
      - id: agg
        env:
          CONTRACT_RESULT: ${{ needs.cloudflared-contract.result }}
        run: |
          set -euo pipefail
          STATES=$(find cf-state -name '*.txt' -exec cat {} + 2>/dev/null | tr -d ' ' | grep -v '^$' || true)
          echo "per-arch states: ${STATES:-<none>}"
          if [[ -z "$STATES" ]]; then
            # No artifacts. Either the contract job never ran because something
            # upstream failed — in which case the build failure is the story and
            # this must not claim a tunnel problem — or it ran and produced
            # nothing, which is broken.
            if [[ "$CONTRACT_RESULT" == "skipped" || "$CONTRACT_RESULT" == "cancelled" ]]; then
              STATE="not-run"
            else
              STATE="broken"
            fi
          elif grep -q '^broken$' <<<"$STATES"; then STATE="broken"
          elif grep -q '^unverified$' <<<"$STATES"; then STATE="unverified"
          else STATE="verified"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "aggregate: $STATE"

  collect-tags:
    needs: [generate-matrix, build, merge-manifests, build-mini, merge-mini-manifests]
    if: always() && !inputs.DRY_RUN
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download all tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{built-tags-*,manifest-tags-*,mini-tags-*,mini-manifest-tags-*}"
          path: all-tags/

      - name: Aggregate tags
        id: collect
        run: |
          if [ -d all-tags ] && [ "$(ls -A all-tags 2>/dev/null)" ]; then
            TAGS=$(find all-tags -name '*.txt' -exec cat {} + | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Found $(echo $TAGS | jq length) unique tags"
          else
            echo "::warning::No tags found - build may have failed"
            TAGS="[]"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

  dry-run:
    needs: generate-matrix
    if: ${{ inputs.DRY_RUN }}
    runs-on: ubuntu-latest
    steps:
      # Needed for configs/base-image.json — this job previously ran with no checkout.
      - uses: actions/checkout@v4
      - name: Print build plan
        env:
          BUILD_MATRIX: ${{ needs.generate-matrix.outputs.build-matrix }}
          MERGE_MATRIX: ${{ needs.generate-matrix.outputs.merge-matrix }}
          MINI_BUILD_MATRIX: ${{ needs.generate-matrix.outputs.mini-build-matrix }}
          BUILD_DATE: ${{ needs.generate-matrix.outputs.build-date }}
          NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
        run: |
          echo "=== DRY RUN - Build Plan ==="
          echo "Build date: $BUILD_DATE"
          echo "Staging namespace: $NAMESPACE_STAGING"
          echo ""

          echo "=== Build Jobs ==="
          echo "$BUILD_MATRIX" | jq -r '.include[] | "  \(.config_key) [\(.arch_suffix)] base=\(.base_image)"'
          echo ""

          echo "=== Merge Jobs ==="
          echo "$MERGE_MATRIX" | jq -r '.include[] | "  \(.config_key) default_py=\(.default_python)"'
          echo ""

          echo "=== Tags that would be created ==="
          # Python matrix from configs/base-image.json (ADR 0019) — it was hardcoded
          # identically in five places here, so the shared table could claim one set
          # of versions while the build shipped another.
          mapfile -t PYTHON_VERSIONS < <(jq -r '.python_versions[]' "$GITHUB_WORKSPACE/configs/base-image.json")
          echo "$MERGE_MATRIX" | jq -c '.include[]' | while IFS= read -r entry; do
            tag_template=$(echo "$entry" | jq -r '.tag_template')
            default_python=$(echo "$entry" | jq -r '.default_python')
            for py in "${PYTHON_VERSIONS[@]}"; do
              py_tag="${py//.}"
              echo "  ${NAMESPACE_STAGING}/base-image:${tag_template}-py${py_tag}-${BUILD_DATE}"
            done
            dp_tag="${default_python//.}"
            echo "  ${NAMESPACE_STAGING}/base-image:${tag_template}-${BUILD_DATE} (alias for py${dp_tag})"
            echo ""
          done

          echo "=== Mini Build Jobs ==="
          echo "$MINI_BUILD_MATRIX" | jq -r '.include[] | "  \(.config_key) [\(.arch_suffix)] cuda=\(.cuda_versions)"'
          echo ""

          echo "=== Mini Tags ==="
          echo "$MINI_BUILD_MATRIX" | jq -c '.include[] | select(.arch_suffix == "amd64")' | while IFS= read -r entry; do
            mini_tag=$(echo "$entry" | jq -r '.mini_tag')
            for py in "3.10" "3.11" "3.12" "3.13" "3.14"; do
              py_tag="${py//.}"
              echo "  ${NAMESPACE_STAGING}/base-image:${mini_tag}-py${py_tag}-${BUILD_DATE}"
            done
          done

  notify:
    needs: [generate-matrix, build, merge-manifests, build-mini, merge-mini-manifests,
            collect-tags, cloudflared-contract-status]
    if: always() && !inputs.DRY_RUN
    uses: ./.github/workflows/notify-slack.yml
    with:
      # THE CONTRACT RESULT MUST REACH THE NOTIFICATION, or the job is decoration.
      # A `needs:` edge alone does not do it: this rendered ✅/❌ purely from
      # needs.build.result, so a build whose cloudflared contract FAILED still
      # reported green — the staging tags are pushed by `build` upstream and
      # promote is a separate dispatch, so nothing else would have caught it.
      #
      # THREE STATES, because the contract has three. Reading job `result` gave
      # only two and got both edges wrong: a rate-limited run proved nothing and
      # rendered ✅, while an ordinary build failure made the contract `skipped`
      # and rendered "the tunnel binary is UNVALIDATED" over what was a compile
      # error — sending the first responder to the wrong place, on every red
      # build. `state` distinguishes them:
      #
      #   verified    every live assertion ran against the shipped binary -> ✅
      #   unverified  Cloudflare declined or was unreachable; nothing proven -> ⚠️
      #   broken      the contract moved -> ❌ and do not promote
      #   not-run     something upstream failed first; the build failure is the
      #               story, so say nothing about tunnels
      #
      # EVERY STAGE THAT PRODUCES AN ARTEFACT MUST SUCCEED, as an ALLOWLIST.
      # This read `needs.build.result` alone — the 24 build cells — and ignored
      # merge-manifests, build-mini and merge-mini-manifests. Observed live: a
      # GitHub 429 fetching the setup-crane action failed one config's manifest
      # merge, which skipped both mini stages, and Slack reported "Base Image
      # Build Successful" for a run whose conclusion was `failure` — with one
      # config having no multi-arch manifest and every mini image missing.
      #
      # `skipped` is tolerated because a FILTERed dispatch legitimately empties
      # the mini matrices. `failure`, `cancelled` and anything unrecognised are
      # not: this enumerates the states that may pass, never the states that must
      # fail, because the state nobody thought of has to land on the failing side.
      build-result: >-
        ${{ (needs.build.result == 'success'
             && contains(fromJSON('["success","skipped"]'), needs.merge-manifests.result)
             && contains(fromJSON('["success","skipped"]'), needs.build-mini.result)
             && contains(fromJSON('["success","skipped"]'), needs.merge-mini-manifests.result)
             && contains(fromJSON('["verified","unverified","not-run"]'), needs.cloudflared-contract-status.outputs.state))
            && 'success' || 'failure' }}
      # The warning state is only meaningful when everything else passed; a run
      # that lost a manifest is a plain failure, not a yellow "unverified".
      status: >-
        ${{ (needs.cloudflared-contract-status.outputs.state == 'unverified'
             && needs.build.result == 'success'
             && contains(fromJSON('["success","skipped"]'), needs.merge-manifests.result)
             && contains(fromJSON('["success","skipped"]'), needs.build-mini.result)
             && contains(fromJSON('["success","skipped"]'), needs.merge-mini-manifests.result))
            && 'warning' || '' }}
      headline: >-
        ${{ needs.cloudflared-contract-status.outputs.state == 'broken'
            && 'cloudflared contract BROKEN — the tunnel binary in these images does not answer the way the portal drives it; do not promote'
            || (needs.build.result == 'success' && !contains(fromJSON('["success","skipped"]'), needs.merge-manifests.result)
                && 'Base image cells all built, but a MANIFEST MERGE failed — the multi-arch tags are incomplete; do not promote this date'
            || (needs.build.result == 'success' && !contains(fromJSON('["success","skipped"]'), needs.build-mini.result)
                && 'Base image cells all built, but the MINI images failed — that set of tags is missing; do not promote this date'
            || (needs.build.result == 'success' && !contains(fromJSON('["success","skipped"]'), needs.merge-mini-manifests.result)
                && 'Base image cells all built, but the MINI manifest merge failed — those multi-arch tags are incomplete; do not promote this date'
            || ((needs.cloudflared-contract-status.outputs.state == 'unverified' && needs.build.result == 'success')
                && 'Base image built — cloudflared contract UNVERIFIED (Cloudflare rate-limited or unreachable); the tunnel binary was not exercised'
            || '')))) }}
      image-name: "Base Image"
      image-ref: ${{ needs.generate-matrix.outputs.build-date }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags || '[]' }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
