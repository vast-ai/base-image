# Build AIO Studio app image (Dockerfile)
# All 8 apps + Blender + Chrome on top of the base image.
# Scheduled bi-weekly, or manual trigger with ref overrides.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_NAMESPACE
# Optional:
#   SLACK_WEBHOOK_URL

name: Build AIO Studio Image

on:
  schedule:
    # Bi-weekly: 1st and 15th of each month at midnight UTC
    - cron: '0 0 1,15 * *'

  workflow_dispatch:
    inputs:
      AIO_BASE:
        # Empty = use DEFAULT_AIO_BASE below. Deliberately NOT defaulted here as well:
        # two defaults for one fact is what left the Dockerfile pinning a failed build
        # in the staging namespace while this workflow named a different tag. One source.
        description: "Base image (empty = the workflow default)"
        required: false
      DOCKERHUB_REPO:
        description: "Push to namespace/<repo>"
        required: true
        default: "aio-studio"
      CUSTOM_IMAGE_TAG:
        description: "Custom tag (default: date)"
        required: false
      # App ref overrides — leave empty for auto-detection
      COMFYUI_REF:
        description: "ComfyUI ref (empty = latest release)"
        required: false
      FORGE_REF:
        description: "SD Forge ref (empty = latest commit)"
        required: false
      VOICEBOX_REF:
        description: "Voicebox ref (empty = latest release)"
        required: false
      AI_TOOLKIT_REF:
        description: "AI Toolkit ref (empty = latest commit)"
        required: false
      WAN2GP_REF:
        description: "Wan2GP ref (empty = latest commit)"
        required: false
      WHISPER_REF:
        description: "Whisper WebUI ref (empty = latest release)"
        required: false
      ACE_STEP_REF:
        description: "ACE Step ref (empty = latest release)"
        required: false

env:
  # Bumped 2026-09-03 to the first base ever built through build -> qa -> promote:
  # it passed a live-GPU cell (three torch venvs importing 2.10.0/2.9.1/2.7.1,
  # flash_attn, create_app_venv, the desktop stack) before publication. The previous
  # value, base-2026-04-15, predated the QA stage and was four and a half months old.
  #
  # ONE source of truth: the dispatch input defaults to empty and falls back here, and
  # the Dockerfile carries no default at all. Bump this only to a tag that already
  # EXISTS — naming one before it is published is the defect this branch started on.
  DEFAULT_AIO_BASE: "vastai/aio-studio:base-2026-09-02"
  DEFAULT_DOCKERHUB_REPO: "aio-studio"

jobs:
  # ── Resolve latest refs for all apps ──
  resolve-refs:
    runs-on: ubuntu-latest
    outputs:
      comfyui-ref: ${{ steps.comfyui.outputs.resolved-ref }}
      forge-ref: ${{ steps.forge.outputs.ref }}
      voicebox-ref: ${{ steps.voicebox.outputs.resolved-ref }}
      ai-toolkit-ref: ${{ steps.ai-toolkit.outputs.ref }}
      wan2gp-ref: ${{ steps.wan2gp.outputs.ref }}
      whisper-ref: ${{ steps.whisper.outputs.resolved-ref }}
      ace-step-ref: ${{ steps.ace-step.outputs.resolved-ref }}
      ace-step-ui-ref: ${{ steps.ace-step-ui.outputs.ref }}
      image-tag: ${{ steps.tag.outputs.tag }}
      should-run: ${{ steps.decision.outputs.should-run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required secrets
        id: secrets
        run: |
          # DOCKERHUB_NAMESPACE_STAGING joined this list when the build moved to
          # staging: unset, the build would push to a malformed "/repo:tag" rather than
          # skip, which is a confusing failure at best.
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" && -n "${{ secrets.DOCKERHUB_NAMESPACE }}" && -n "${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping - secrets not configured"
          fi

      # Apps with releases — resolve latest tag
      # Apps with releases — resolve latest tag (always, no age gating)
      - name: Resolve ComfyUI ref
        id: comfyui
        uses: ./.github/actions/check-github-release
        with:
          repository: Comfy-Org/ComfyUI
          age-threshold-seconds: "999999999"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger: ${{ inputs.COMFYUI_REF && 'manual' || github.event_name }}
          manual-ref: ${{ inputs.COMFYUI_REF }}
          default-ref: master

      - name: Resolve Voicebox ref
        id: voicebox
        uses: ./.github/actions/check-github-release
        with:
          repository: jamiepine/voicebox
          age-threshold-seconds: "999999999"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger: ${{ inputs.VOICEBOX_REF && 'manual' || github.event_name }}
          manual-ref: ${{ inputs.VOICEBOX_REF }}
          default-ref: main

      - name: Resolve Whisper WebUI ref
        id: whisper
        uses: ./.github/actions/check-github-release
        with:
          repository: jhj0517/Whisper-WebUI
          age-threshold-seconds: "999999999"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger: ${{ inputs.WHISPER_REF && 'manual' || github.event_name }}
          manual-ref: ${{ inputs.WHISPER_REF }}
          default-ref: master

      - name: Resolve ACE Step ref
        id: ace-step
        uses: ./.github/actions/check-github-release
        with:
          repository: ace-step/ACE-Step-1.5
          age-threshold-seconds: "999999999"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trigger: ${{ inputs.ACE_STEP_REF && 'manual' || github.event_name }}
          manual-ref: ${{ inputs.ACE_STEP_REF }}
          default-ref: main

      # Apps without releases — resolve latest commit
      - name: Resolve SD Forge ref
        id: forge
        shell: bash
        run: |
          if [[ -n "${{ inputs.FORGE_REF }}" ]]; then
            echo "ref=${{ inputs.FORGE_REF }}" >> $GITHUB_OUTPUT
          else
            REF=""
            for attempt in 1 2 3; do
              REF=$(git ls-remote https://github.com/Haoming02/sd-webui-forge-classic.git HEAD 2>/dev/null | cut -f1 | cut -c1-7) || REF=""
              if [[ -n "$REF" ]]; then break; fi
              if (( attempt < 3 )); then echo "Attempt $attempt/3: ls-remote failed, retrying in 3s..."; sleep 3; fi
            done
            if [[ -z "$REF" ]]; then
              echo "::error::Could not resolve HEAD of Haoming02/sd-webui-forge-classic after 3 attempts"
              exit 1
            fi
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve AI Toolkit ref
        id: ai-toolkit
        shell: bash
        run: |
          if [[ -n "${{ inputs.AI_TOOLKIT_REF }}" ]]; then
            echo "ref=${{ inputs.AI_TOOLKIT_REF }}" >> $GITHUB_OUTPUT
          else
            REF=""
            for attempt in 1 2 3; do
              REF=$(git ls-remote https://github.com/ostris/ai-toolkit.git HEAD 2>/dev/null | cut -f1 | cut -c1-7) || REF=""
              if [[ -n "$REF" ]]; then break; fi
              if (( attempt < 3 )); then echo "Attempt $attempt/3: ls-remote failed, retrying in 3s..."; sleep 3; fi
            done
            if [[ -z "$REF" ]]; then
              echo "::error::Could not resolve HEAD of ostris/ai-toolkit after 3 attempts"
              exit 1
            fi
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Wan2GP ref
        id: wan2gp
        shell: bash
        run: |
          if [[ -n "${{ inputs.WAN2GP_REF }}" ]]; then
            echo "ref=${{ inputs.WAN2GP_REF }}" >> $GITHUB_OUTPUT
          else
            REF=""
            for attempt in 1 2 3; do
              REF=$(git ls-remote https://github.com/deepbeepmeep/Wan2GP.git HEAD 2>/dev/null | cut -f1 | cut -c1-7) || REF=""
              if [[ -n "$REF" ]]; then break; fi
              if (( attempt < 3 )); then echo "Attempt $attempt/3: ls-remote failed, retrying in 3s..."; sleep 3; fi
            done
            if [[ -z "$REF" ]]; then
              echo "::error::Could not resolve HEAD of deepbeepmeep/Wan2GP after 3 attempts"
              exit 1
            fi
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve ACE Step UI ref
        id: ace-step-ui
        shell: bash
        run: |
          REF=""
          for attempt in 1 2 3; do
            REF=$(git ls-remote https://github.com/fspecii/ace-step-ui.git HEAD 2>/dev/null | cut -f1 | cut -c1-7) || REF=""
            if [[ -n "$REF" ]]; then break; fi
            if (( attempt < 3 )); then echo "Attempt $attempt/3: ls-remote failed, retrying in 3s..."; sleep 3; fi
          done
          if [[ -z "$REF" ]]; then
            echo "::error::Could not resolve HEAD of fspecii/ace-step-ui after 3 attempts"
            exit 1
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.CUSTOM_IMAGE_TAG }}" ]]; then
            echo "tag=${{ inputs.CUSTOM_IMAGE_TAG }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Determine if build should run
        id: decision
        run: |
          if [[ "${{ steps.secrets.outputs.available }}" == "true" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## Resolved Refs" >> $GITHUB_STEP_SUMMARY
          echo "| App | Ref |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ComfyUI | \`${{ steps.comfyui.outputs.resolved-ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SD Forge | \`${{ steps.forge.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Voicebox | \`${{ steps.voicebox.outputs.resolved-ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Toolkit | \`${{ steps.ai-toolkit.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Wan2GP | \`${{ steps.wan2gp.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Whisper WebUI | \`${{ steps.whisper.outputs.resolved-ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ACE Step | \`${{ steps.ace-step.outputs.resolved-ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ACE Step UI | \`${{ steps.ace-step-ui.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | **${{ steps.tag.outputs.tag }}** |" >> $GITHUB_STEP_SUMMARY

  # ── Build app image ──
  # BUILD PUSHES TO STAGING, NOT PRODUCTION, and carries no environment gate.
  #
  # It used to do both wrong things at once: push straight to the production namespace
  # (moving :latest with it) and carry `environment: production` on the BUILD job. That
  # gate asked for approval BEFORE anything existed, so a reviewer approved a promise;
  # and because the environment was conditional on workflow_dispatch, the bi-weekly
  # SCHEDULE had no gate at all and shipped to customers unattended and untested.
  #
  # The gate now sits on `promote`, after `qa` has run against the built artifact —
  # which is the only order in which an approval means anything.
  build:
    needs: resolve-refs
    if: needs.resolve-refs.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to STAGING
        run: |
          NAMESPACE="${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}"
          REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          TAG="${{ needs.resolve-refs.outputs.image-tag }}"
          AIO_BASE="${{ inputs.AIO_BASE || env.DEFAULT_AIO_BASE }}"

          cd derivatives/pytorch/derivatives/aio-studio
          docker buildx build \
            --platform linux/amd64 \
            --build-arg AIO_BASE="${AIO_BASE}" \
            --build-arg COMFYUI_REF=${{ needs.resolve-refs.outputs.comfyui-ref }} \
            --build-arg FORGE_REF=${{ needs.resolve-refs.outputs.forge-ref }} \
            --build-arg VOICEBOX_REF=${{ needs.resolve-refs.outputs.voicebox-ref }} \
            --build-arg AI_TOOLKIT_REF=${{ needs.resolve-refs.outputs.ai-toolkit-ref }} \
            --build-arg WAN2GP_REF=${{ needs.resolve-refs.outputs.wan2gp-ref }} \
            --build-arg WHISPER_REF=${{ needs.resolve-refs.outputs.whisper-ref }} \
            --build-arg ACE_STEP_REF=${{ needs.resolve-refs.outputs.ace-step-ref }} \
            --build-arg ACE_STEP_UI_REF=${{ needs.resolve-refs.outputs.ace-step-ui-ref }} \
            --build-context comfyui=../comfyui \
            -t "${NAMESPACE}/${REPO}:${TAG}-amd64" \
            . --push

          # -amd64 suffix so `merge-arch-manifests` can stitch the production index from
          # it (arches: amd64 — this image is single-arch today). NO :latest here: that
          # is a production pointer and moving it before QA is what let an untested
          # image become the default pull.
          echo "STAGING_TAG=${NAMESPACE}/${REPO}:${TAG}" >> $GITHUB_ENV

      # No tag artifact here any more. collect-tags feeds the Slack message, and a
      # STAGING tag reported as a build output is a tag nobody can pull. What shipped is
      # decided by `promote`, so `promote` is what records it.
      - name: Note the staged tag
        run: echo "staged ${{ env.STAGING_TAG }}-amd64 (not published until QA passes)" >> $GITHUB_STEP_SUMMARY

  # Live-GPU QA gate (ADR 0005). This image had NO gate of any kind until now: it
  # promoted on a successful docker build, which certifies that the layers assembled and
  # nothing about whether the eight apps it exists to provide are usable.
  #
  # It does NOT start the apps, and that is correct rather than lazy: all nine supervisor
  # programs ship autostart=false because eight heavyweight apps cannot share a GPU, so
  # "every app is RUNNING" is not a property this image has. The cell asserts the two
  # things that ARE true of every launch — each app venv resolves the torch it was built
  # against, and each app is a program supervisord knows with a launcher and a route.
  qa:
    needs: [resolve-refs, build]
    if: needs.resolve-refs.outputs.should-run == 'true'
    uses: ./.github/workflows/qa-gate.yml
    with:
      repo: ${{ inputs.DOCKERHUB_REPO || 'aio-studio' }}
      tag: ${{ needs.resolve-refs.outputs.image-tag }}-amd64
      template_dir: derivatives/pytorch/derivatives/aio-studio/templates/aio-studio-qa
      label: base-image-qa-aio-studio
      # The apps log under their own names; these two are what a failing cell needs.
      log_paths: "/var/log/portal/comfyui.log /var/log/portal/unsloth-studio.log"
      # CI-side half of the template's INSTANCE_TEST_REQUIRE_PASS (ADR 0019/0031).
      # Declared in BOTH places on purpose: the runner enforces it in-instance, and this
      # enforces it against the verdict payload, so a template edit that drops the env
      # var still cannot produce a passing gate.
      require_tests: "base/60-gpu-cuda base/61-cuda-compute base/62-gpu-libraries aio-base.d/10-base-venvs aio-base.d/20-base-desktop aio.d/10-aio-app-venvs aio.d/20-aio-services"
      # ADR 0029 condition 5: the redraw rule is not forked per image.
      retries: 2
    secrets:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DOCKERHUB_NAMESPACE_STAGING: ${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # PROMOTE is where the production namespace, the :latest pointer and the approval gate
  # all live — after QA, never before.
  #
  # `needs.qa.result == 'success'` is stated explicitly rather than left to GitHub's
  # implicit skip-on-failure, so the gate is visible in the file. There is no
  # `!cancelled()` here because this workflow has no advisory cell to keep alive.
  #
  # The environment is conditional on workflow_dispatch, matching every other image in
  # the repo: QA is the automated gate that always applies, and human approval is the
  # extra a manual run gets. What changed is that the approval now follows the evidence.
  promote:
    needs: [resolve-refs, build, qa]
    if: needs.resolve-refs.outputs.should-run == 'true' && needs.qa.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive tags
        run: |
          REPO="${{ inputs.DOCKERHUB_REPO || env.DEFAULT_DOCKERHUB_REPO }}"
          TAG="${{ needs.resolve-refs.outputs.image-tag }}"
          echo "STAGING_TAG_BASE=${{ secrets.DOCKERHUB_NAMESPACE_STAGING }}/${REPO}:${TAG}" >> $GITHUB_ENV
          echo "PROD_TAG=${{ secrets.DOCKERHUB_NAMESPACE }}/${REPO}:${TAG}" >> $GITHUB_ENV
          echo "LATEST_TAG=${{ secrets.DOCKERHUB_NAMESPACE }}/${REPO}:latest" >> $GITHUB_ENV

      - name: Assemble production index from the QA'd staging image
        uses: ./.github/actions/merge-arch-manifests
        with:
          target-tag: ${{ env.PROD_TAG }}
          source-tag-base: ${{ env.STAGING_TAG_BASE }}
          # Single-arch today. When this image gains arm64, add it here and to the build
          # matrix together — a suffix listed here that was never built fails loudly.
          arches: amd64
          # :latest moves ONLY here, aliased off the dated tag that just passed QA.
          extra-tags: ${{ env.LATEST_TAG }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record promoted tag
        run: |
          mkdir -p built-tags
          printf '%s\n%s\n' "${{ env.PROD_TAG }}" "${{ env.LATEST_TAG }}" > built-tags/tag.txt

      - name: Upload promoted tag
        uses: actions/upload-artifact@v4
        with:
          name: built-tag
          path: built-tags/
          retention-days: 1

  collect-tags:
    needs: [resolve-refs, build, promote]
    if: always() && needs.resolve-refs.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      all-tags: ${{ steps.collect.outputs.tags }}
    steps:
      - name: Download all tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: built-tag*
          path: all-tags/
          merge-multiple: true

      - name: Aggregate tags
        id: collect
        run: |
          if [ -d all-tags ] && [ "$(ls -A all-tags 2>/dev/null)" ]; then
            TAGS=$(cat all-tags/*.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            TAGS="[]"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  notify:
    needs: [resolve-refs, build, qa, promote, collect-tags]
    if: always() && needs.resolve-refs.outputs.should-run == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      # PROMOTE, not build. Keying this on `needs.build.result` meant a green build whose
      # QA failed still announced success -- the recurring defect this repo has been bitten
      # by four times, and the reason notify now lists qa and promote in `needs` (a
      # `needs.<job>` reference to a job absent from that list evaluates to empty and the
      # arm silently never fires).
      build-result: ${{ needs.promote.result }}
      # ENUMERATE THE WAY IT GOES RIGHT: every arm that can render "promoted" is keyed on
      # promote taking the negative branch first, so a cancelled or skipped run cannot
      # fall through to the success text.
      headline: ${{ (needs.build.result != 'success' && 'AIO Studio build failed') || (needs.qa.result == 'failure' && 'AIO Studio QA FAILED on real GPU — not promoted') || (needs.promote.result == 'failure' && 'AIO Studio promotion failed') || (needs.promote.result != 'success' && 'AIO Studio NOT promoted — promotion did not run') || 'AIO Studio promoted — live-GPU QA passed' }}
      image-name: "AIO Studio"
      image-ref: ${{ needs.resolve-refs.outputs.image-tag }}
      image-tags: ${{ needs.collect-tags.outputs.all-tags }}
      trigger: ${{ github.event_name }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
