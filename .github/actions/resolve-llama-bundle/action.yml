# .github/actions/resolve-llama-bundle/action.yml
name: Resolve Unsloth llama.cpp prebuilt bundle
description: >
  Pick the prebuilt llama.cpp bundle an image should bake, and emit its release tag,
  exact asset name and expected sha256 (ADR 0018). Selection lives here, in CI, so the
  Dockerfile fetches ONE known URL and verifies ONE known hash — it never constructs an
  asset name or trusts a manifest at build time.

inputs:
  repository:
    description: "Repo publishing the bundles"
    required: false
    default: "unslothai/llama.cpp"
  cuda-major:
    description: "CUDA major line the image runs (e.g. 12) — must match the base image's CUDA runtime"
    required: true
  install-kind:
    description: "Manifest install_kind to select (linux-cuda for x64, linux-arm64-cuda for aarch64)"
    required: false
    default: "linux-cuda"
  coverage-class:
    description: "Manifest coverage_class to select. 'portable' is the widest SASS arch set."
    required: false
    default: "portable"
  release-tag:
    description: "Pin a specific release tag instead of scanning for the newest usable one"
    required: false
    default: ""
  max-releases:
    description: "How many recent releases to scan before giving up"
    required: false
    default: "10"
  github-token:
    description: "Token for GitHub API requests (raises the rate limit)"
    required: false
    default: ""

outputs:
  release-tag:
    description: "The release the bundle comes from"
    value: ${{ steps.resolve.outputs.release-tag }}
  asset-name:
    description: "Exact asset filename to download"
    value: ${{ steps.resolve.outputs.asset-name }}
  sha256:
    description: "Expected sha256 of that asset, from the release's checksum manifest"
    value: ${{ steps.resolve.outputs.sha256 }}
  supported-sms:
    description: "Arch set the bundle DECLARES (informational only — the build asserts the artifact)"
    value: ${{ steps.resolve.outputs.supported-sms }}

runs:
  using: composite
  steps:
    - name: Resolve bundle
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        CUDA_MAJOR: ${{ inputs.cuda-major }}
        INSTALL_KIND: ${{ inputs.install-kind }}
        COVERAGE_CLASS: ${{ inputs.coverage-class }}
        PINNED_TAG: ${{ inputs.release-tag }}
        MAX_RELEASES: ${{ inputs.max-releases }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, re, sys, urllib.error, urllib.request

        REPO = os.environ["REPOSITORY"]
        RUNTIME_LINE = f"cuda{os.environ['CUDA_MAJOR'].split('.')[0]}"
        INSTALL_KIND = os.environ["INSTALL_KIND"]
        COVERAGE = os.environ["COVERAGE_CLASS"]
        PINNED = os.environ.get("PINNED_TAG", "").strip()
        MAX = int(os.environ.get("MAX_RELEASES") or 10)
        TOKEN = os.environ.get("GH_TOKEN", "").strip()

        def fetch(url, *, as_json=True):
            req = urllib.request.Request(url, headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": "vastai-base-image-ci",
                **({"Authorization": f"Bearer {TOKEN}"} if TOKEN else {}),
            })
            with urllib.request.urlopen(req, timeout=30) as r:
                raw = r.read()
            return json.loads(raw) if as_json else raw

        def asset_url(release, name):
            for a in release.get("assets", []):
                if a.get("name") == name:
                    return a.get("browser_download_url")
            return None

        if PINNED:
            releases = [fetch(f"https://api.github.com/repos/{REPO}/releases/tags/{PINNED}")]
        else:
            # Sort client-side: GitHub's list order follows created_at, which does not
            # always track recency (see check-github-release for the same caveat).
            rels = fetch(f"https://api.github.com/repos/{REPO}/releases?per_page=100")
            rels = [r for r in rels if not r.get("draft") and not r.get("prerelease")]
            rels.sort(key=lambda r: r.get("published_at") or "", reverse=True)
            releases = rels[:MAX]

        problems = []
        for rel in releases:
            tag = rel.get("tag_name")
            man_url = asset_url(rel, "llama-prebuilt-manifest.json")
            sha_url = asset_url(rel, "llama-prebuilt-sha256.json")
            if not man_url or not sha_url:
                problems.append(f"{tag}: no manifest/checksum asset")
                continue
            manifest, checksums = fetch(man_url), fetch(sha_url)

            # Cross-check the checksum asset's self-reported release against the release
            # we actually read it from, so a stale or swapped file cannot authorise an
            # asset from a different build. REQUIRED, not best-effort: a missing field
            # means the cross-check ADR 0018 binds us to cannot be performed at all.
            claimed = checksums.get("release_tag")
            if claimed != tag:
                problems.append(
                    f"{tag}: checksum manifest claims release {claimed!r}"
                    if claimed else f"{tag}: checksum manifest has no release_tag to cross-check")
                continue

            match = next((a for a in manifest.get("artifacts", [])
                          if a.get("install_kind") == INSTALL_KIND
                          and a.get("coverage_class") == COVERAGE
                          and a.get("runtime_line") == RUNTIME_LINE), None)
            if not match:
                problems.append(f"{tag}: no {INSTALL_KIND}/{COVERAGE}/{RUNTIME_LINE} artifact")
                continue

            name = match["asset_name"]
            entry = (checksums.get("artifacts") or {}).get(name) or {}
            digest = entry.get("sha256")
            if not digest:
                problems.append(f"{tag}: {name} absent from the checksum manifest")
                continue
            if not asset_url(rel, name):
                problems.append(f"{tag}: {name} listed but not published")
                continue

            # Everything below is upstream-controlled text on its way into $GITHUB_OUTPUT,
            # then into a multi-line `build-args:` block, then into a shell `curl -o`.
            # A newline in any of it would inject extra key=value lines. Constrain the
            # shapes before they leave this action.
            for label, value, shape in (("asset name", name, r"[A-Za-z0-9._+-]+"),
                                        ("release tag", tag, r"[A-Za-z0-9._+-]+"),
                                        ("sha256", digest, r"[0-9a-f]{64}")):
                if not re.fullmatch(shape, value or ""):
                    sys.stderr.write(f"refusing unsafe {label} from upstream: {value!r}\n")
                    sys.exit(1)

            print(f"release-tag={tag}")
            print(f"asset-name={name}")
            print(f"sha256={digest}")
            print("supported-sms=" + ",".join(str(s) for s in match.get("supported_sms", [])))
            sys.stderr.write(
                f"Selected {name} from {tag} "
                f"(declares sm {','.join(str(s) for s in match.get('supported_sms', []))}; "
                "the build asserts the artifact itself)\n")
            break
        else:
            sys.stderr.write("No usable llama.cpp bundle found:\n  " + "\n  ".join(problems) + "\n")
            sys.exit(1)
        PY
