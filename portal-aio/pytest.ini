[pytest]
# `live` = the test drives the real cloudflared binary and creates a real
# trycloudflare tunnel against Cloudflare's API.
#
# Two reasons this marker exists, both learned the hard way:
#
#   1. Deselection. `-m "not live"` lets the per-PR static suite run without
#      spending real tunnels on a binary that is not the one that ships. The
#      build-time job, which extracts the binary from the image it just built,
#      is the run that should spend them.
#
#   2. Visibility of SKIPS. These are the only tests here that can say anything
#      about the shipped binary, and their normal degraded outcome is `skip`
#      (rate-limited, offline). pytest then exits 0, which is indistinguishable
#      from "verified" to anything reading an exit code. The CI job classifies
#      the junit report by this marker instead, so a run that proved nothing is
#      reported as UNVERIFIED rather than green.
markers =
    live: drives the real cloudflared binary and creates a real tunnel
