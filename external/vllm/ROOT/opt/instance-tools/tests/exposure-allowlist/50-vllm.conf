# vllm exposure allowlist — Ray's cluster surface (ADR 0006 fragment, ADR 0028 grammar).
#
# STATED EXCEPTION TO ADR 0028 BINDING CONDITION 4, rather than slipped past it.
# That condition says a public bind on an LLM engine is "a finding to fix, not an
# allowlist entry". The fix it assumes — bind loopback — is refused by Ray upstream.
# ray/scripts/scripts.py routes --node-ip-address through
# services.resolve_ip_for_localhost(), whose docstring is "Convert to a remotely
# reachable IP if the address is localhost or 127.0.0.1". Measured on a live cell:
# the flag was passed and Ray logged "Local node IP: 172.17.0.2", with the violation
# set unchanged. So loopback is not an option Ray offers, and an entry here is the
# honest alternative to leaving seven listeners undeclared and invisible.
#
# What IS controllable is WHICH ports, and supervisor-scripts/ray.sh now pins every
# one Ray opens into this block. Before that they were ephemeral and changed every
# boot, so no port-keyed entry could ever have matched them — this range and that
# pin are one change, and widening the range here without widening ray.sh is exactly
# how it would decay into a blanket.
#
# Not reachable from outside the instance: the platform forwards only ports a
# template maps, and none of these are mapped. That is a property of the platform,
# not of this image, which is why they are declared rather than dismissed.
range:6379-6499/tcp   internal   Ray cluster services — GCS 6379, raylet 6380, object manager 6381, dashboard agent 6382-6383, metrics 6384, runtime-env agent 6385, workers 6390-6499; pinned in supervisor-scripts/ray.sh
