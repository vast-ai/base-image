# vllm exposure allowlist — Ray's cluster surface (ADR 0006 fragment, ADR 0028 grammar).
#
# STATED EXCEPTION TO ADR 0028 BINDING CONDITION 4, rather than slipped past it.
# That condition says a public bind on an LLM engine is "a finding to fix, not an
# allowlist entry". The fix it assumes — bind loopback — is refused by Ray upstream.
# ray/scripts/scripts.py routes --node-ip-address through
# services.resolve_ip_for_localhost(), whose docstring is "Convert to a remotely
# reachable IP if the address is localhost or 127.0.0.1". Measured on a live cell:
# the flag was passed and Ray logged "Local node IP: 172.17.0.2", with the violation
# set unchanged. So loopback is not an option Ray offers, and an entry here is the
# honest alternative to leaving seven listeners undeclared and invisible.
#
# SCOPE, MEASURED RATHER THAN INTENDED. ray.sh passes --node-manager-port,
# --object-manager-port, --dashboard-agent-listen-port, --dashboard-agent-grpc-port,
# --metrics-export-port, --runtime-env-agent-port and --min/--max-worker-port to pin
# Ray's surface into 6379-6499. On a live cell that did NOT happen: raylet still held
# two ephemeral ports (33365, 39753), the dashboard agent two more (42437, 46163),
# and two agent processes another two. Ray accepted the flags — it rejects unknown
# options, and --dashboard-port/--dashboard-host in the same string demonstrably took
# effect — so those services simply open more listeners than any flag governs.
#
# Therefore this file declares 6379 and nothing else. Declaring the full range would
# cover 120 ports nothing binds, which is a blanket waiting for someone to lean on,
# and it would state a pin that was measured not to hold.
#
# THE RANGE IS KNOWN AND TOO WIDE TO DECLARE. Ray does not bind(0) and take a
# kernel-assigned ephemeral port; ray/_private/services.py draws its own:
#     def new_port(lower_bound=10000, upper_bound=65535, denylist=None):
#         port = random.randint(lower_bound, upper_bound)
# 55,536 ports. Declaring that window would pass essentially any high port, which is
# a disabled check wearing an allowlist entry's clothes. It also checks the result
# against an in-process denylist ONLY, never against what the machine already has
# bound — see docs/invariants.md for the collision risk that creates against our own
# fixed ports.
#
# RAY'S REMAINING PUBLIC LISTENERS ARE AN OPEN DEFECT, LEFT VISIBLE ON PURPOSE.
# base/28 reports them as violations on every cell, and they should stay reported.
# The tempting fixes are both worse than the finding: not starting Ray on
# single-GPU deployments would clean our QA cells while leaving the exposure intact
# for any customer running tensor parallelism — hiding it from ourselves — and
# widening this declaration would say they are fine when nobody has established
# that. They are not currently reachable, because the platform forwards only ports a
# template maps and these are unmappable by anyone who cannot predict them, but that
# is the platform's port map and not a control this image owns.
6379/tcp   internal   Ray GCS — the cluster control plane, pinned by `--port 6379` in supervisor-scripts/ray.sh. This is the ONLY Ray port that is provably pinned; see the note above about the rest.
