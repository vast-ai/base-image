# Kev-9B on the stock pytorch -mini image, provisioned by provisioning/kev/kev.yaml (ADR 0046).
# KEV_TEMPLATE_REF and the commit in PROVISIONING_MANIFEST must be the same base-image commit.
name: "Kev 9B - System One Decision Model"
image: vastai/pytorch
tag: 2.8.0-cu128-cuda-12.9-mini-py313-2026-09-08
href: https://github.com/jaredpalmer/kev
repo: vastai/pytorch
ports:
  - "1111:1111"
  - "8080:8080"
  - "8384:8384"
  - "3000:3000"
  - "8000:8000"
env:
  OPEN_BUTTON_PORT: "1111"
  OPEN_BUTTON_TOKEN: "1"
  JUPYTER_DIR: /
  DATA_DIRECTORY: /workspace/
  PORTAL_CONFIG: "localhost:1111:11111:/:Instance Portal|localhost:8000:18000:/docs:Kev API|localhost:3000:13000:/:Kev Playground|localhost:8080:18080:/:Jupyter|localhost:8080:8080:/terminals/1:Jupyter Terminal|localhost:8384:18384:/:Syncthing"
  PROVISIONING_MANIFEST: "https://raw.githubusercontent.com/vast-ai/base-image/8ca53fc2269401e47f2da3cc3f69243b51c9afef/provisioning/kev/kev.yaml"
  KEV_TEMPLATE_REF: "8ca53fc2269401e47f2da3cc3f69243b51c9afef"
  KEV_MODEL: "jaredpalmer/kev-9b@2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c"
  KEV_MERGE: "0"
onstart: entrypoint.sh
runtype: jupyter
jup_direct: true
ssh_direct: true
use_ssh: true
use_jupyter_lab: false
extra_filters:
  cpu_arch:
    in:
      - amd64
  cuda_max_good:
    gte: 12.9
  compute_cap:
    gte: 800
  gpu_ram:
    gte: 23000
recommended_disk_space: 60.0
desc: "Kev-9B: open decision model with TypeSafe-compatible /v1/systemone API and playground"
private: true
readme_visible: true
