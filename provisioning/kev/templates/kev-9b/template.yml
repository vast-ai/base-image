# Kev-9B on the stock pytorch -mini image, provisioned by provisioning/kev/kev.yaml (ADR 0046).
# KEV_TEMPLATE_REF and the commit in PROVISIONING_MANIFEST must be the same base-image commit.
name: "Kev 9B - System One Decision Model"
image: vastai/pytorch
tag: 2.8.0-cu128-cuda-12.9-mini-py313-2026-09-08
href: https://github.com/jaredpalmer/kev
repo: vastai/pytorch
ports:
  - "1111:1111"
  - "8080:8080"
  - "8384:8384"
  - "3000:3000"
  - "7860:7860"
  - "8000:8000"
env:
  OPEN_BUTTON_PORT: "1111"
  OPEN_BUTTON_TOKEN: "1"
  JUPYTER_DIR: /
  DATA_DIRECTORY: /workspace/
  PORTAL_CONFIG: "localhost:1111:11111:/:Instance Portal|localhost:8080:18080:/:Jupyter|localhost:8080:8080:/terminals/1:Jupyter Terminal|localhost:8384:18384:/:Syncthing|localhost:3000:13000:/:Kev Playground|localhost:7860:17860:/:Kev UI|localhost:8000:18000:/docs:Kev API"
  PROVISIONING_MANIFEST: "https://raw.githubusercontent.com/vast-ai/base-image/986a2c95fc97f5690a88eaaf7e984104f8bd7b5f/provisioning/kev/kev.yaml"
  KEV_TEMPLATE_REF: "986a2c95fc97f5690a88eaaf7e984104f8bd7b5f"
  KEV_MODEL: "jaredpalmer/kev-9b@2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c"
  KEV_MERGE: "0"
onstart: entrypoint.sh
runtype: jupyter
jup_direct: true
ssh_direct: true
use_ssh: true
use_jupyter_lab: false
extra_filters:
  cpu_arch:
    in:
      - amd64
  cuda_max_good:
    gte: 12.9
  compute_cap:
    gte: 800
  gpu_ram:
    gte: 23000
recommended_disk_space: 60.0
desc: "Kev-9B: open decision model with TypeSafe-compatible /v1/systemone API, playground and UI"
private: true
readme_visible: true
